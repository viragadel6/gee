<style>
html, body, #app{
  touch-action: pan-x pan-y;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overscroll-behavior: none;
}
input, textarea, select, [contenteditable="true"]{
  font-size: 16px !important;
  max-height: 100%;
}

:root{
  color-scheme: dark;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --blue: #0000ff;              --blue-l: #00ff00;
  --accent: #0000ff;            --green-soft: #ffffff;
  --fg: #f5f5f7;                --fg2: rgba(245,245,247,.58);
  --fg3: rgba(245,245,247,.28); --bg: #000000;
  --sep: rgba(255,255,255,.055);--hover: rgba(255,255,255,.055);
  --liquid: rgba(246,246,250,.018);
  --liquid2: rgba(0,40,218,.033);
  --liquid3: rgba(255,255,255,.015);
  --liquid-border: rgba(0,0,0,.068);
  --liquid-border-strong: rgba(232,232,246,.118);
  --liquid-inset: rgba(255,255,255,.105);
  --liquid-edge: rgba(255,255,255,.08);
  --liquid-shadow: rgba(0,0,10,.34);
  --input-glow: rgba(11,0,246,.118);
  --send-border: rgba(0,9,205,.22);
  --send-inset: rgba(255,255,255,.18);
  --send-shadow: rgba(80,90,255,.18);
}

*{ box-sizing: border-box; margin: 0; padding: 0; }
html{
  width: 100%; height: 100%; overflow: hidden;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  background: var(--bg);
  margin: 0; padding: 0;
}
body{
  width: 100%; height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--fg);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-user-drag: none;
  touch-action: pan-y;
  margin: 0; padding: 0;
}
input, textarea, [contenteditable="true"], .bubble, .ai-bubble, .bubble *, .ai-bubble *, pre, code, .cb, .cb *{
  -webkit-user-select: text; user-select: text;
  -webkit-touch-callout: default;
}
button, a, label, summary, svg, img{
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-user-drag: none;
}
button, input, textarea{ font: inherit; appearance: none; -webkit-appearance: none; }
textarea{ border-radius: 0; }

#bg{
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: #000000;
}
#bg::before{
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(135deg,#4b6cf7 0%,#000 50%,#0009cd 100%);
  opacity: .15;
  filter: blur(80px);
}
#bg::after{
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,.98));
}

#app{
  position: absolute; inset: 0; z-index: 1;
  display: flex; flex-direction: column;
  width: 100%; height: 100%;
  overflow: hidden;
}

.lg{
  position: relative; overflow: hidden; isolation: isolate;
  transform: translateZ(0);
  background: linear-gradient(145deg, var(--liquid2), var(--liquid3) 48%, var(--liquid));
  border: .45px solid var(--liquid-border);
  box-shadow: 0 .7px 0 var(--liquid-inset) inset, 0 -.45px 0 rgba(0,0,0,.14) inset, 0 0 0 .35px rgba(80,90,255,.07), 0 14px 42px var(--liquid-shadow);
  -webkit-backdrop-filter: blur(36px) saturate(190%) contrast(1.08) brightness(1.04);
  backdrop-filter: blur(36px) saturate(190%) contrast(1.08) brightness(1.04);
}
.lg:before{
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(150deg, rgba(255,255,255,.105), rgba(255,255,255,.022) 34%, rgba(80,90,255,.035) 58%, rgba(11,0,246,.025));
  mix-blend-mode: screen;
}
.lg:after{
  content: "";
  position: absolute; inset: .5px;
  border-radius: inherit;
  pointer-events: none;
  border: .35px solid rgba(255,255,255,.035);
  box-shadow: 0 0 18px rgba(80,90,255,.04) inset;
}
.lg > *{ position: relative; z-index: 1; }

#sidebar{
  position: fixed; top: 0; bottom: 0; left: 0; right: 0;
  width: 100%; max-width: 100%;
  z-index: 310;
  padding-top: var(--sat); padding-left: var(--sal); padding-right: var(--sar);
  display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform .42s cubic-bezier(.32,.72,0,1.18);
  will-change: transform;
  background: rgba(2,8,5,.18);
  -webkit-backdrop-filter: blur(48px) saturate(185%) contrast(1.05);
  backdrop-filter: blur(48px) saturate(185%) contrast(1.05);
  transform-style: preserve-3d;
}
#sidebar.open{ transform: translateX(0); }
#sidebar.dragging{ transition: none; }
#sidebar[aria-hidden="true"]{ pointer-events: none; }
#sidebar[aria-hidden="false"]{ pointer-events: auto; }

.sb-backdrop{
  position: fixed; inset: 0; z-index: 309;
  background: rgba(0,0,0,.5);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  opacity: 0; pointer-events: none;
  transition: opacity .35s cubic-bezier(.25,1,.5,1);
}
.sb-backdrop.open{ opacity: 1; pointer-events: auto; }

.sb-hdr{
  height: 52px; display: flex; align-items: center;
  padding: 0 12px;
  border-bottom: .5px solid var(--sep);
  gap: 8px; flex-shrink: 0;
}
.sb-title{
  flex: 1; text-align: center;
  font-size: 15px; font-weight: 600; letter-spacing: -.3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sb-close{
  width: 30px; height: 30px; border-radius: 50%;
  background: transparent; border: none;
  display: flex; align-items: center; justify-content: center;
  color: var(--fg2);
}
.sb-close:active{ transform: scale(.88); opacity: .7; }
.sb-close svg{ width: 17px; height: 17px; }

#sb-search-bar{
  height: 0; visibility: hidden; overflow: hidden;
  transition: height .32s cubic-bezier(.34,1.28,.64,1), visibility .32s;
}
#sb-search-bar.open{ height: 54px; visibility: visible; }

.sb-si{
  height: 38px; margin: 8px 14px 6px; border-radius: 18px;
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
}
.sb-si svg{ width: 16px; height: 16px; fill: var(--fg3); flex-shrink: 0; }

#sb-q{
  flex: 1; background: transparent; border: none; outline: none;
  font-size: 16px !important; color: var(--fg); min-width: 0;
}
#sb-q::placeholder{ color: var(--fg3); }

#sb-q-cancel{
  background: transparent; border: none; color: var(--green-soft);
  font-size: 15px; width: 0; opacity: 0; pointer-events: none; overflow: hidden;
  transition: width .2s, opacity .2s; white-space: nowrap;
}
#sb-search-bar.open #sb-q-cancel{ width: 52px; opacity: 1; pointer-events: auto; }

.sb-body{
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain; padding: 12px;
}
.sb-body::-webkit-scrollbar, #scroll-area::-webkit-scrollbar, .img-strip::-webkit-scrollbar, .src-chips::-webkit-scrollbar, #ta::-webkit-scrollbar{
  display: none;
}
.sb-body, #scroll-area, .img-strip, .src-chips, #ta{
  scrollbar-width: none;
}

.sb-pull-hint{
  display: flex; align-items: center; justify-content: center; gap: 5px;
  padding: 6px 0 0; font-size: 11px; color: var(--fg3);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.sb-pull-hint svg{ width: 12px; height: 12px; }
#sidebar.pull-hinting .sb-pull-hint{ opacity: 1; }

.sb-new{
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 11px 13px; border-radius: 16px; margin-bottom: 10px;
  font-size: 13.5px; font-weight: 500; color: var(--green-soft);
  text-align: left; border: none; background: transparent;
}
.sb-new svg{ width: 16px; height: 16px; fill: var(--green-soft); flex-shrink: 0; }
.sb-new:active, .hcard:active{ transform: scale(.97); }

.sb-sec{
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  color: var(--fg3); letter-spacing: .5px; padding: 2px 3px 8px; margin-top: 4px;
}

.hcard{
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 12px; border-radius: 16px;
  background: transparent; border: .5px solid transparent;
  margin-bottom: 6px;
  transition: transform .22s cubic-bezier(.2,1,.3,1), background .14s, border-color .14s;
}
@media (hover:hover) and (pointer:fine){
  .hcard:hover{
    background: var(--hover);
    -webkit-backdrop-filter: blur(22px) saturate(170%);
    backdrop-filter: blur(22px) saturate(170%);
    border-color: var(--liquid-border-strong);
  }
}
.hcard.active{
  background: linear-gradient(135deg, rgba(11,0,246,.075), rgba(80,90,255,.07));
  border-color: rgba(80,90,255,.25);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 0 0 .35px rgba(80,90,255,.06), 0 8px 28px rgba(80,90,255,.05);
}
.hcard-body{ flex: 1; min-width: 0; }
.hcard-pre{
  font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; letter-spacing: -.15px;
}
.hcard-pre mark{
  background: rgba(80,90,255,.18); color: var(--green-soft);
  border-radius: 3px; padding: 0 1px;
}
.hcard.active .hcard-pre{ color: var(--green-soft); }
.hcard-meta{ font-size: 11px; color: var(--fg3); margin-top: 2px; }
.hcard-del{
  width: 24px; height: 24px; border-radius: 8px; background: transparent; border: none;
  color: var(--fg3); opacity: 0; pointer-events: none;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.hcard-del svg{ width: 14px; height: 14px; fill: currentColor; }
.hcard:hover .hcard-del, .hcard:focus-within .hcard-del{ opacity: 1; pointer-events: auto; }
@media (pointer: coarse){
  .hcard-del{ opacity: 1; pointer-events: auto; }
}
.hcard-del:active{ background: rgba(255,59,48,.15); color: rgba(255,59,48,.85); transform: scale(.85); }

.hcard-pin{ display: none; width: 11px; height: 11px; margin-right: 3px; vertical-align: middle; }
.hcard.pinned .hcard-pin{ display: inline-block; }
.hcard-pin svg{ fill: var(--green-soft); }

.hcard-pre[contenteditable="true"]{
  outline: none; background: rgba(0,255,157,.1); border-radius: 7px;
  padding: 2px 5px; margin: -2px -5px; white-space: normal;
}

.h-empty{
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 9px; padding: 48px 16px; text-align: center;
}
.h-empty svg{ width: 28px; height: 28px; fill: var(--fg3); opacity: .45; }
.h-empty p{ font-size: 13px; color: var(--fg3); line-height: 1.5; }

#content{
  flex: 1; overflow: hidden; position: relative; z-index: 1;
  touch-action: pan-y; display: flex; flex-direction: column; min-height: 0;
}
#scroll-area{
  flex: 1; position: relative; top: 0; right: 0; bottom: 0; left: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain; touch-action: pan-y;
  padding: calc(12px + var(--sat)) 0 16px;
  scroll-padding-top: 20px; scroll-padding-bottom: 24px;
  min-height: 0;
}
#msg-list{
  display: flex; flex-direction: column;
  padding: 0 calc(14px + var(--sar)) 0 calc(14px + var(--sal));
  min-height: 100%;
}
.msg-group{ display: flex; flex-direction: column; margin-bottom: 8px; }
.msg-group.u{ align-items: flex-end; }
.msg-group.a{ align-items: flex-start; }
.bubble, .ai-bubble{
  max-width: 100%; font-size: 15px; line-height: 1.5; letter-spacing: -.18px;
  word-break: break-word; overflow-wrap: anywhere; position: relative;
}
.u .bubble{
  color: #f7fffb; max-width: 85%; padding: 9px 14px; border-radius: 20px;
  background: linear-gradient(138deg, rgba(0,9,205,.78) 0%, rgba(80,90,255,.72) 48%, rgba(95,106,247,.66) 100%);
  border: .45px solid rgba(160,170,255,.32);
  box-shadow: 0 5px 26px rgba(80,90,255,.15), 0 3px 18px rgba(11,0,246,.08), 0 1.2px 0 rgba(255,255,255,.22) inset, 0 -.7px 0 rgba(0,0,0,.16) inset;
  -webkit-backdrop-filter: blur(24px) saturate(175%);
  backdrop-filter: blur(24px) saturate(175%);
}
.user-message-text{
  max-height: 7.5em;
  overflow: hidden;
}
.user-message-collapsible.is-expanded .user-message-text{
  max-height: none;
}
.user-message-expand{
  display: none;
  margin: 7px 0 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: rgba(255,255,255,.78);
  font: inherit;
  font-size: 12px;
  line-height: 1.4;
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}
 .user-message-collapsible.can-collapse .user-message-expand{
  display: block;
}
.edit-banner{
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin: 0 0 8px; padding: 7px 12px; border-radius: 12px;
  border: 1px solid var(--sep); background: rgba(255,255,255,.05);
  color: var(--fg2); font-size: 12px;
}
.edit-banner button{
  border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 12px;
  text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 2px 4px;
}
.ai-bubble{ padding: 4px 0; background: transparent; border: none; box-shadow: none; }
.thinking{
  width: min(100%, 680px); margin: 4px 0 9px; border: 1px solid var(--sep);
  border-radius: 12px; background: rgba(255,255,255,.035); overflow: hidden;
}
.thinking summary{
  cursor: pointer; padding: 9px 12px; color: var(--fg2); font-size: 12px;
  user-select: none; list-style: none;
}
.thinking summary::-webkit-details-marker{ display: none; }
.thinking summary:before{ content: "›"; display: inline-block; margin-right: 7px; transition: transform .2s; }
.thinking[open] summary:before{ transform: rotate(90deg); }
.thinking-text{
  padding: 0 12px 11px; color: var(--fg2); font-size: 13px; line-height: 1.55;
  white-space: pre-wrap; overflow-wrap: anywhere; user-select: text;
}
.cot-tools{padding:0 12px 11px;color:var(--fg2);font-size:13px;overflow-wrap:anywhere;position:relative;z-index:1;}
.cot-tool{border-top:1px solid var(--sep);padding:8px 0;}
.cot-tool summary{cursor:pointer;}
.cot-tool pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;}

.md p{ margin: 0 0 8px; }
.md p:last-child{ margin-bottom: 0; }
.md h1, .md h2, .md h3{ margin: 12px 0 7px; line-height: 1.3; font-weight: 600; }
.md h1{ font-size: 19px; }
.md h2{ font-size: 17px; }
.md h3{ font-size: 15.5px; }
.md ul, .md ol{ margin: 6px 0 8px; padding-left: 22px; }
.md li{ margin: 3px 0; }
.md a{ color: var(--green-soft); text-decoration: none; }
.md hr{ border: none; border-top: 1px solid var(--sep); margin: 12px 0; }
.md .ic{
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: .88em; background: rgba(255,255,255,.045);
  padding: 1.5px 5px; border-radius: 6px; border: .5px solid var(--liquid-border);
}
.md table{
  width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px;
  border-radius: 10px; overflow: hidden; border: 1px solid var(--sep);
}
.md th{
  padding: 7px 11px; text-align: left; font-size: 11px; font-weight: 600;
  text-transform: uppercase; color: var(--fg2); letter-spacing: .3px;
  border-bottom: 1px solid var(--sep); white-space: nowrap;
}
.md td{ padding: 7px 11px; border-bottom: 1px solid var(--sep); vertical-align: top; }
.md tr:last-child td{ border-bottom: none; }

.err-bbl{
  display: inline-block; max-width: 90%; margin: 4px 0; padding: 9px 13px;
  font-size: 13.5px; line-height: 1.45; background: rgba(0,255,157,.095);
  border: .5px solid rgba(0,255,157,.2); border-radius: 15px; word-break: break-word;
}
.rcn-bar{
  display: flex; align-items: center; gap: 7px; margin: 5px 14px; padding: 8px 12px;
  background: rgba(0,40,218,.08); border: .5px solid rgba(0,40,218,.16);
  border-radius: 13px; font-size: 12px; color: rgba(80,90,255,.9);
}
.rcn-bar svg{ width: 13px; height: 13px; fill: currentColor; animation: spin 1.1s linear infinite; }

.typing{ display: flex; align-items: center; gap: 4px; padding: 10px 2px; }
.td{ width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); animation: tbounce 1.3s infinite ease-in-out; }
.td:nth-child(2){ animation-delay: .18s; }
.td:nth-child(3){ animation-delay: .36s; }
@keyframes tbounce{
  0%, 60%, 100%{ transform: translateY(0); opacity: .4; }
  30%{ transform: translateY(-5px); opacity: 1; }
}
@-webkit-keyframes tbounce{
  0%, 60%, 100%{ transform: translateY(0); opacity: .4; }
  30%{ transform: translateY(-5px); opacity: 1; }
}
.t-row{ display: flex; align-items: center; gap: 4px; margin-top: 3px; pointer-events: auto; opacity: .85; }
.tact{
  display: flex; align-items: center; gap: 4px; background: transparent;
  border: .5px solid transparent; color: var(--fg3); font-size: 11.5px;
  padding: 3px 7px; border-radius: 8px;
}
.tact:active{ transform: scale(.9); }
.tact svg{ width: 13px; height: 13px; fill: currentColor; }
.btime{ font-size: 11px; color: var(--fg3); padding: 0 4px; }

#ib-wrap{
  position: relative; z-index: 200;
  padding-bottom: var(--sab); padding-left: var(--sal); padding-right: var(--sar);
  background: transparent; overflow: visible; pointer-events: none;
  flex-shrink: 0; width: 100%;
}
[data-native-app="true"] #ib-wrap{ position: relative; flex-shrink: 0; }
#ib-wrap.keyboard-open{
  position: relative;
  margin-bottom: var(--native-keyboard-height, 0px);
}

  sheenFalloff: 1.5,
  glow: 0.12,
  glowSpread: 1,
  glowFalloff: 0.5,
};

const BLANK_MAP = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";
const DISPERSION_SPREAD = 0.22;
const ERF_K = Math.sqrt(Math.PI);
const erf = (x) => Math.tanh(ERF_K * x);

const domeGradientMean = (radius, halfExtent) =>
  halfExtent > 0 ? (radius - Math.sqrt(radius * radius - halfExtent * halfExtent)) / halfExtent : 0;

const computeDomeConstants = (capDepth, halfW, halfH) => {
  const cap = Math.max(0.01, Math.min(capDepth, Math.min(halfW, halfH) - 1));
  const Rx = (halfW * halfW + cap * cap) / (2 * cap);
  const Ry = (halfH * halfH + cap * cap) / (2 * cap);
  const meanX = domeGradientMean(Rx, halfW);
  const meanY = domeGradientMean(Ry, halfH);
  return { Rx, Ry, scaleX: meanX > 0 ? 0.5 / meanX : 1, scaleY: meanY > 0 ? 0.5 / meanY : 1 };
};

const domeGradient = (distance, radius, scale) => {
  const inside = Math.min(distance, radius * (1 - 1e-3));
  return (inside / Math.sqrt(radius * radius - inside * inside)) * scale;
};

const matrixForAxisScale = (x, y) =>
  `${x} 0 0 0 ${0.5 * (1 - x)}  0 ${y} 0 0 ${0.5 * (1 - y)}  0 0 1 0 0  0 0 0 1 0`;

const maskCache = new Map();
const roundedRectMaskUri = (w, h, radius) => {
  const boxW = Math.max(1, Math.round(w));
  const boxH = Math.max(1, Math.round(h));
  const rad = Math.max(0, Math.min(Math.round(radius), Math.min(boxW, boxH) / 2));
  const key = `rr·${boxW}·${boxH}·${rad}`;
  const cached = maskCache.get(key);
  if (cached) return { uri: cached, key };
  const inset = 0.5;
  const fillW = Math.max(0, boxW - 2 * inset);
  const fillH = Math.max(0, boxH - 2 * inset);
  const corner = Math.max(0, rad - inset);
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' preserveAspectRatio='none' viewBox='0 0 ${boxW} ${boxH}'><rect fill='black' rx='${corner}' ry='${corner}' x='${inset}' y='${inset}' width='${fillW}' height='${fillH}'/></svg>`;
  const uri = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
  maskCache.set(key, uri);
  return { uri, key };
};

const lensShapeMaskUri = (w, h, radius) => {
  const iw = Math.max(1, Math.round(w));
  const ih = Math.max(1, Math.round(h));
  const r = Math.max(0, Math.min(Math.round(radius), Math.floor(Math.min(iw, ih) / 2)));
  return roundedRectMaskUri(iw, ih, r);
};

const encodeAxis = (signed) => ((0.5 + signed) * 255 + 0.5) | 0;
const encodeSpec = (spec) => (127 * spec + 128 + 0.5) | 0;

const createLensMapGenerator = (size) => {
  let canvas = null;
  let ctx = null;
  let image = null;
  let domeLut = null;
  let lutDome = -Infinity;
  let lutHalfW = -Infinity;
  let lutHalfH = -Infinity;
  let lutLen = 0;
  let lutDirty = true;
  let dome = null;

  return {
    generate(shape) {
      if (!canvas) {
        canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        ctx = canvas.getContext("2d");
        image = ctx.createImageData(size, size);
      }
      const {
        lensHalfWidth: halfW,
        lensHalfHeight: halfH,
        borderRadius,
        depth,
        clipToShape,
        softEdge,
        sheenAngle = 45,
        glow = 0,
        glowSpread = 1,
        glowFalloff = 1.5,
        sheen = 0,
        sheenWidth = 3,
        sheenFalloff = 1.5,
        curvature = 0,
        splay = 0,
        bend = 0,
        bendWidth = 0.16,
      } = shape;
      const data = image.data;
      const half = size >> 1;
      const radius = Math.min(borderRadius, Math.min(halfW, halfH));
      const minHalf = Math.min(halfW, halfH);
      const depthPx = Math.min(depth * minHalf, minHalf - 1);
      const innerHalfW = Math.max(0, halfW - depthPx);
      const innerHalfH = Math.max(0, halfH - depthPx);
      const innerRadius = Math.max(0, Math.min(borderRadius, Math.min(innerHalfW, innerHalfH)));
      const falloff = depthPx > 0 ? Math.SQRT1_2 / depthPx : 1e6;
      const hasSpecular = glow > 0 || sheen > 0;
      const angle = (sheenAngle * Math.PI) / 180;
      const cosA = Math.cos(angle);
      const sinA = Math.sin(angle);
      const edgeInv = sheenWidth > 0 ? 1 / sheenWidth : 0;
      const glowReachInv = 1 / Math.max(2, glowSpread * Math.min(halfW, halfH));
      const stepX = (2 * halfW) / size;
      const stepY = (2 * halfH) / size;
      const invW = 1 / halfW;
      const invH = 1 / halfH;
      const hasDome = curvature > 0;
      const domeCap = curvature * Math.min(halfW, halfH);
      const hasSplay = splay > 0;
      const hasEdgeRefract = bend > 0;
      const erInv = 1 / Math.max(2, bendWidth * Math.min(halfW, halfH));

      const cornerDistance = (ox, oy) => (ox > 0 || oy > 0 ? Math.sqrt(ox * ox + oy * oy) : 0);

      if (hasDome) {
        if (!dome || Math.abs(domeCap - lutDome) > 0.5 || Math.abs(halfW - lutHalfW) > 1 || Math.abs(halfH - lutHalfH) > 1) {
          dome = computeDomeConstants(domeCap, halfW, halfH);
          lutDome = domeCap;
          lutHalfW = halfW;
          lutHalfH = halfH;
          lutDirty = true;
        }
        if (lutLen !== half) {
          domeLut = new Float32Array(half);
          lutLen = half;
          lutDirty = true;
        }
        if (lutDirty) {
          const r2 = dome.Rx * dome.Rx;
          const rMax = dome.Rx * (1 - 1e-3);
          for (let col = 0; col < half; col++) {
            const px = -((col + 0.5) * stepX - halfW);
            const clamped = px < rMax ? px : rMax;
            domeLut[col] = (clamped / Math.sqrt(r2 - clamped * clamped)) * dome.scaleX;
          }
          lutDirty = false;
        }
      }
      const lut = hasDome ? domeLut : null;
      const splayHalf = 0.5 * Math.min(halfW, halfH);
      const splayInv = splayHalf > 0 ? 1 / splayHalf : 0;
      const sheenNorm = Math.SQRT1_2;

      for (let row = 0; row < half; row++) {
        const mirrorRow = size - 1 - row;
        const py = -((row + 0.5) * stepY - halfH);
        const edgeY = py - halfH + radius;
        const innerEdgeY = softEdge ? py - innerHalfH + innerRadius : 0;
        const dirYBase = hasDome && lut ? domeGradient(py, dome.Ry, dome.scaleY) : py * invH > 1 ? 1 : py * invH;
        const normY = py * invH > 1 ? 1 : py * invH;
        const splayY = hasSplay ? Math.max(0, 1 - (halfH - py) * splayInv) : 0;
        const rowBase = row * size;
        const mirrorRowBase = mirrorRow * size;

        for (let col = 0; col < half; col++) {
          const mirrorCol = size - 1 - col;
          const px = -((col + 0.5) * stepX - halfW);
          const edgeX = px - halfW + radius;
          const sdf =
            cornerDistance(edgeX > 0 ? edgeX : 0, edgeY > 0 ? edgeY : 0) +
            (edgeX > edgeY ? (edgeX > 0 ? 0 : edgeX) : edgeY > 0 ? 0 : edgeY) -
            radius;

          const i00 = (rowBase + col) * 4;
          const i01 = (rowBase + mirrorCol) * 4;
          const i10 = (mirrorRowBase + col) * 4;
          const i11 = (mirrorRowBase + mirrorCol) * 4;

          if (clipToShape && sdf >= 0) {
            for (const idx of [i00, i01, i10, i11]) {
              data[idx] = 128;
              data[idx + 1] = 128;
              data[idx + 2] = 128;
              data[idx + 3] = 255;
            }
            continue;
          }

          let dirX = lut ? lut[col] : px * invW > 1 ? 1 : px * invW;
          let dirY = dirYBase;
          if (hasSplay) {
            const yAtt = splayY * splay;
            const xAtt = Math.max(0, 1 - (halfW - px) * splayInv) * splay;
            if (yAtt > 0.001 || xAtt > 0.001) {
              const prevX = dirX;
              const prevY = dirY;
              dirX = prevX * (1 - yAtt);
              dirY = prevY * (1 - xAtt);
              const prevLen = Math.sqrt(prevX * prevX + prevY * prevY);
              const nextLen = Math.sqrt(dirX * dirX + dirY * dirY);
              if (nextLen > 0.001) {
                const restore = prevLen / nextLen;
                dirX *= restore;
                dirY *= restore;
              }
            }
          }

          let edgeOpacity = 1;
          if (softEdge) {
            const ix = px - innerHalfW + innerRadius;
            const innerSdf =
              cornerDistance(ix > 0 ? ix : 0, innerEdgeY > 0 ? innerEdgeY : 0) +
              (ix > innerEdgeY ? (ix > 0 ? 0 : ix) : innerEdgeY > 0 ? 0 : innerEdgeY) -
              innerRadius;
            edgeOpacity = 0.5 * (1 + erf(innerSdf * falloff));
          }

          let dx = 0.5 * dirX * edgeOpacity;
          let dy = 0.5 * dirY * edgeOpacity;

          if (hasEdgeRefract) {
            const s = sdf < 0 ? Math.max(0, 1 + sdf * erInv) : 0;
            if (s > 0) {
              const len = Math.sqrt(dirX * dirX + dirY * dirY);
              if (len > 1e-4) {
                const m = 6.75 * s * s * (1 - s);
                const a = (0.5 * bend * m * edgeOpacity) / len;
                dx += dirX * a;
                dy += dirY * a;
              }
            }
          }

          let specMain = 0;
          let specCross = 0;
          if (hasSpecular) {
            const normX = px * invW > 1 ? 1 : px * invW;
            const axisMain = Math.min(1, Math.abs(normX * cosA + normY * sinA) * sheenNorm);
            const axisCross = Math.min(1, Math.abs(normX * cosA - normY * sinA) * sheenNorm);
            if (sheen > 0) {
              const band = sdf < 0 ? Math.max(0, 1 + sdf * edgeInv) : 0;
              const b = sheen * Math.pow(band, sheenFalloff);
              specMain += b * (0.16 + 0.84 * Math.pow(axisMain, 1.6));
              specCross += b * (0.16 + 0.84 * Math.pow(axisCross, 1.6));
            }
            if (glow > 0) {
              const reach = sdf < 0 ? Math.min(1, -sdf * glowReachInv) : 1;
              const t = 1 - reach;
              const g = glow * Math.pow(t * t * (3 - 2 * t), glowFalloff) * edgeOpacity;
              specMain += g * (0.6 + 0.4 * axisMain);
              specCross += g * (0.6 + 0.4 * axisCross);
            }
            if (specMain > 1) specMain = 1; else if (specMain < -1) specMain = -1;
            if (specCross > 1) specCross = 1; else if (specCross < -1) specCross = -1;
          }

          const rPos = encodeAxis(dx);
          const rNeg = encodeAxis(-dx);
          const gPos = encodeAxis(dy);
          const gNeg = encodeAxis(-dy);
          const bMain = encodeSpec(specMain);
          const bCross = encodeSpec(specCross);

          data[i00] = rPos; data[i00 + 1] = gPos; data[i00 + 2] = bMain; data[i00 + 3] = 255;
          data[i01] = rNeg; data[i01 + 1] = gPos; data[i01 + 2] = bCross; data[i01 + 3] = 255;
          data[i10] = rPos; data[i10 + 1] = gNeg; data[i10 + 2] = bCross; data[i10 + 3] = 255;
          data[i11] = rNeg; data[i11 + 1] = gNeg; data[i11 + 2] = bMain; data[i11 + 3] = 255;
        }
      }
      ctx.putImageData(image, 0, 0);
      return canvas.toDataURL();
    },
    dispose() {
      if (canvas) {
        canvas.width = 0;
        canvas.height = 0;
        canvas = null;
      }
      ctx = null;
      image = null;
      domeLut = null;
      dome = null;
      lutDome = -Infinity;
      lutHalfW = -Infinity;
      lutHalfH = -Infinity;
      lutLen = 0;
      lutDirty = true;
    }
  };
};

const SPRING_STIFFNESS = 176;
const SPRING_DAMPING = 13.6;
const STRETCH_CEILING = 0.34;
const SPEED_SHAPE = 0.75;
const SPEED_DIVISOR = 84;
const MAX_STEP = 0.033;
const VEL_DT_MIN = 0.008;
const VEL_DT_MAX = 0.03;

const useLensWobble = (position, stretch, holdRef, kickRef) => {
  React.useEffect(() => {
    let frame = 0;
    let displacement = 0;
    let speedValue = 0;
    let prevStamp = 0;
    let prevPosition = position.get();
    let active = false;

    const stretchTarget = (pointerSpeed) => {
      const fromSpeed = Math.pow(pointerSpeed, SPEED_SHAPE) / SPEED_DIVISOR;
      const responsive = fromSpeed < STRETCH_CEILING ? fromSpeed : STRETCH_CEILING;
      const held = holdRef.current;
      const raised = responsive > held ? responsive : held;
      return raised < STRETCH_CEILING ? raised : STRETCH_CEILING;
    };

    const settled = (pointerSpeed) =>
      Math.abs(displacement) < 6e-4 &&
      Math.abs(speedValue) < 6e-3 &&
      pointerSpeed < 6e-3 &&
      holdRef.current === 0;

    const step = (now) => {
      const gap = (now - prevStamp) / 1e3;
      const dt = gap < MAX_STEP ? gap : MAX_STEP;
      prevStamp = now;

      const pos = position.get();
      const velDt = gap < VEL_DT_MIN ? VEL_DT_MIN : gap > VEL_DT_MAX ? VEL_DT_MAX : gap;
      const pointerSpeed = Math.abs((pos - prevPosition) / velDt);
      prevPosition = pos;

      const target = stretchTarget(pointerSpeed);
      const accel = SPRING_STIFFNESS * (target - displacement) - SPRING_DAMPING * speedValue;
      speedValue += accel * dt;
      displacement += speedValue * dt;
      stretch.set(displacement);

      if (settled(pointerSpeed)) {
        active = false;
        stretch.set(0);
        return;
      }
      frame = requestAnimationFrame(step);
    };

    const begin = () => {
      if (active) return;
      active = true;
      prevStamp = performance.now();
      prevPosition = position.get();
      frame = requestAnimationFrame(step);
    };

    kickRef.current = begin;
    const detach = position.on("change", begin);
    return () => {
      detach();
      cancelAnimationFrame(frame);
      kickRef.current = () => {};
    };
  }, [position, stretch, holdRef, kickRef]);
};

const rubberBand = (excess, limit, range) => {
  const t = excess < range ? excess / range : 1;
  return limit * t * (3 + t * (t - 3));
};

const GlassDiv = React.forwardRef(({ x, scaleX, scaleY, style, children, ...rest }, forwardedRef) => {
  const nodeRef = React.useRef(null);

  React.useEffect(() => {
    const node = nodeRef.current;
    if (!node) return;
    const sources = [x, scaleX, scaleY].filter((v) => v != null);
    const compose = () => {
      let transform = "";
      if (x) transform = `translateX(${x.get()}px)`;
      if (scaleX || scaleY) {
        const sx = scaleX ? scaleX.get() : 1;
        const sy = scaleY ? scaleY.get() : 1;
        transform += `${transform ? " " : ""}scale(${sx}, ${sy})`;
      }
      node.style.transform = transform;
    };
    compose();
    const detaches = sources.map((v) => v.on("change", compose));
    return () => detaches.forEach((off) => off());
  }, [x, scaleX, scaleY]);

  return (
    <div
      ref={(node) => {
        nodeRef.current = node;
        if (typeof forwardedRef === "function") forwardedRef(node);
        else if (forwardedRef) forwardedRef.current = node;
      }}
      style={style}
      {...rest}
    >
      {children}
    </div>
  );
});

const VERT = `#version 300 es
in vec2 a_pos;
out vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const BLIT_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 o;
uniform sampler2D u_src;
void main() { o = texture(u_src, v_uv); }`;

const BLUR_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 o;
uniform sampler2D u_src;
uniform vec2 u_step;
void main() {
  vec4 c = texture(u_src, v_uv) * 0.1857;
  c += (texture(u_src, v_uv + u_step)       + texture(u_src, v_uv - u_step))       * 0.1671;
  c += (texture(u_src, v_uv + 2.0 * u_step) + texture(u_src, v_uv - 2.0 * u_step)) * 0.1227;
  c += (texture(u_src, v_uv + 3.0 * u_step) + texture(u_src, v_uv - 3.0 * u_step)) * 0.0768;
  c += (texture(u_src, v_uv + 4.0 * u_step) + texture(u_src, v_uv - 4.0 * u_step)) * 0.0414;
  o = c;
}`;

const LENS_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 o;
uniform sampler2D u_src;
uniform sampler2D u_blur;
uniform sampler2D u_disp;
uniform vec2 u_origin;
uniform vec2 u_size;
uniform vec2 u_scale;
uniform vec2 u_lenspx;
uniform float u_radiuspx;
uniform float u_dispersion;
uniform float u_sheen;
uniform float u_frost;
uniform float u_opacity;
uniform float u_brightness;

float sdRoundRect(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
}

vec3 frosted(vec2 p, float mixAmt) {
  vec3 raw = texture(u_src, p).rgb;
  return mixAmt > 0.0 ? mix(raw, texture(u_blur, p).rgb, mixAmt) : raw;
}

void main() {
  vec2 lensUV = (v_uv - u_origin) / u_size;
  vec2 p = (lensUV - 0.5) * u_lenspx;
  float sdf = sdRoundRect(p, u_lenspx * 0.5, min(u_radiuspx, min(u_lenspx.x, u_lenspx.y) * 0.5));
  float coverage = (1.0 - smoothstep(-1.0, 1.0, sdf)) * u_opacity;
  if (coverage <= 0.0) discard;
  vec4 d = texture(u_disp, clamp(lensUV, 0.0, 1.0));
  vec2 disp = (d.rg - 0.5) * u_scale;
  vec2 uvR = v_uv + disp * (1.0 + u_dispersion * 0.22);
  vec2 uvG = v_uv + disp * (1.0 + u_dispersion * 0.11);
  vec2 uvB = v_uv + disp;
  vec3 lensCol = vec3(frosted(uvR, u_frost).r, frosted(uvG, u_frost).g, frosted(uvB, u_frost).b);
  lensCol += u_sheen * max(0.0, d.b - 0.5);
  if (u_brightness > 0.0) lensCol = mix(lensCol, vec3(1.0), clamp(u_brightness, 0.0, 1.0));
  else if (u_brightness < 0.0) lensCol = mix(lensCol, vec3(0.0), clamp(-u_brightness, 0.0, 1.0));
  vec3 backdrop = texture(u_src, v_uv).rgb;
  o = vec4(mix(backdrop, lensCol, coverage), 1.0);
}`;

const compileShader = (gl, type, src) => {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(sh);
    gl.deleteShader(sh);
    throw new Error(`Shader: ${log}`);
  }
  return sh;
};

const linkProgram = (gl, vsSrc, fsSrc) => {
  const p = gl.createProgram();
  const vs = compileShader(gl, gl.VERTEX_SHADER, vsSrc);
  const fs = compileShader(gl, gl.FRAGMENT_SHADER, fsSrc);
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.bindAttribLocation(p, 0, "a_pos");
  gl.linkProgram(p);
  gl.deleteShader(vs);
  gl.deleteShader(fs);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(p);
    gl.deleteProgram(p);
    throw new Error(`Link: ${log}`);
  }
  return p;
};

class GlassWebGLRenderer {
  constructor(canvas) {
    const gl = canvas.getContext("webgl2", {
      premultipliedAlpha: false,
      alpha: true,
      antialias: false,
      preserveDrawingBuffer: false,
    });
    if (!gl) throw new Error("WebGL2 not available");
    this.gl = gl;
    this.blit = linkProgram(gl, VERT, BLIT_FRAG);
    this.lens = linkProgram(gl, VERT, LENS_FRAG);
    this.blur = linkProgram(gl, VERT, BLUR_FRAG);

    this.quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

    const makeTex = () => {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      return t;
    };
    this.srcTex = makeTex();
    this.dispTex = makeTex();
    this.dispCache = new Map();
    this.blurTex = [makeTex(), makeTex()];
    this.fbo = [gl.createFramebuffer(), gl.createFramebuffer()];
    this.blurW = 0;
    this.blurH = 0;
    this.srcW = 0;
    this.srcH = 0;
    this.disposed = false;

    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

    this.uBlitSrc = gl.getUniformLocation(this.blit, "u_src");
    this.uBlur = {
      src: gl.getUniformLocation(this.blur, "u_src"),
      step: gl.getUniformLocation(this.blur, "u_step"),
    };
    this.uLens = {
      src: gl.getUniformLocation(this.lens, "u_src"),
      blur: gl.getUniformLocation(this.lens, "u_blur"),
      disp: gl.getUniformLocation(this.lens, "u_disp"),
      origin: gl.getUniformLocation(this.lens, "u_origin"),
      size: gl.getUniformLocation(this.lens, "u_size"),
      scale: gl.getUniformLocation(this.lens, "u_scale"),
      lenspx: gl.getUniformLocation(this.lens, "u_lenspx"),
      radiuspx: gl.getUniformLocation(this.lens, "u_radiuspx"),
      dispersion: gl.getUniformLocation(this.lens, "u_dispersion"),
      specular: gl.getUniformLocation(this.lens, "u_sheen"),
      frost: gl.getUniformLocation(this.lens, "u_frost"),
      opacity: gl.getUniformLocation(this.lens, "u_opacity"),
      brightness: gl.getUniformLocation(this.lens, "u_brightness"),
    };
  }

  ensureBlurTargets(w, h) {
    if (w === this.blurW && h === this.blurH) return;
    const gl = this.gl;
    for (let i = 0; i < 2; i++) {
      gl.bindTexture(gl.TEXTURE_2D, this.blurTex[i]);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo[i]);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.blurTex[i], 0);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.blurW = w;
    this.blurH = h;
  }

  renderFrost(blurPx) {
    const gl = this.gl;
    this.ensureBlurTargets(this.srcW, this.srcH);
    gl.useProgram(this.blur);
    gl.viewport(0, 0, this.srcW, this.srcH);
    gl.activeTexture(gl.TEXTURE0);
    gl.uniform1i(this.uBlur.src, 0);

    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo[0]);
    gl.bindTexture(gl.TEXTURE_2D, this.srcTex);
    gl.uniform2f(this.uBlur.step, blurPx / this.srcW, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo[1]);
    gl.bindTexture(gl.TEXTURE_2D, this.blurTex[0]);
    gl.uniform2f(this.uBlur.step, 0, blurPx / this.srcH);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  setDisplacementMap(img) {
    if (this.disposed) return;
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.dispTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  }

  dispTexFor(img) {
    const gl = this.gl;
    let tex = this.dispCache.get(img);
    if (!tex) {
      tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      this.dispCache.set(img, tex);
    }
    return tex;
  }

  releaseDispMap(img) {
    const tex = this.dispCache.get(img);
    if (tex) {
      this.gl.deleteTexture(tex);
      this.dispCache.delete(img);
    }
  }

  resize(w, h) {
    const c = this.gl.canvas;
    if (c.width !== w || c.height !== h) {
      c.width = w;
      c.height = h;
    }
  }

  uploadSource(src, w, h) {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.srcTex);
    if (w !== this.srcW || h !== this.srcH) {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
      this.srcW = w;
      this.srcH = h;
    } else {
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, src);
    }
  }

  render(source, srcW, srcH, lenses) {
    if (this.disposed || srcW === 0 || srcH === 0) return;
    const gl = this.gl;
    this.uploadSource(source, srcW, srcH);

    gl.bindBuffer(gl.ARRAY_BUFFER, this.quad);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.disable(gl.BLEND);

    const maxBlur = lenses.reduce((mx, d) => Math.max(mx, d.blur || 0), 0);
    if (maxBlur > 0) this.renderFrost(maxBlur);

    const cw = gl.canvas.width;
    const ch = gl.canvas.height;
    gl.viewport(0, 0, cw, ch);

    gl.useProgram(this.blit);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.srcTex);
    gl.uniform1i(this.uBlitSrc, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.useProgram(this.lens);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.srcTex);
    gl.uniform1i(this.uLens.src, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, this.dispTex);
    gl.uniform1i(this.uLens.disp, 1);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, this.blurTex[1]);
    gl.uniform1i(this.uLens.blur, 2);

    for (let i = 0; i < lenses.length; i++) {
      const d = lenses[i];
      const opacity = d.opacity ?? 1;
      if (opacity <= 0) continue;

      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, d.dispMap ? this.dispTexFor(d.dispMap) : this.dispTex);

      gl.uniform2f(this.uLens.origin, d.originX, d.originY);
      gl.uniform2f(this.uLens.size, d.sizeX, d.sizeY);
      gl.uniform2f(this.uLens.scale, d.scaleX, d.scaleY);
      gl.uniform2f(this.uLens.lenspx, d.sizeX * cw, d.sizeY * ch);
      gl.uniform1f(this.uLens.radiuspx, (d.cornerRadius ?? 0) * cw);
      gl.uniform1f(this.uLens.dispersion, d.dispersion);
      gl.uniform1f(this.uLens.specular, d.specular);
      gl.uniform1f(this.uLens.frost, d.blur > 0 ? Math.min(1, d.blur / 8) : 0);
      gl.uniform1f(this.uLens.opacity, opacity);
      gl.uniform1f(this.uLens.brightness, d.brightness ?? 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
  }

  dispose() {
    if (this.disposed) return;
    this.disposed = true;
    const gl = this.gl;
    gl.deleteProgram(this.blit);
    gl.deleteProgram(this.lens);
    gl.deleteProgram(this.blur);
    gl.deleteTexture(this.srcTex);
    gl.deleteTexture(this.dispTex);
    this.dispCache.forEach((t) => gl.deleteTexture(t));
    this.dispCache.clear();
    gl.deleteTexture(this.blurTex[0]);
    gl.deleteTexture(this.blurTex[1]);
    gl.deleteFramebuffer(this.fbo[0]);
    gl.deleteFramebuffer(this.fbo[1]);
    gl.deleteBuffer(this.quad);
    const lose = gl.getExtension("WEBGL_lose_context");
    if (lose) lose.loseContext();
  }
}

const resolveLens = (spec) => ({
  merged: { ...DEFAULT_LENS_PARAMS, ...spec.lens },
  lensW: spec.lensW,
  lensH: spec.lensH,
  radius: spec.borderRadius,
  x: spec.x,
  y: spec.y,
  scale: spec.scale ?? 1,
  opacity: spec.opacity ?? 1,
});

const useLensRenderer = (outRef, containerRef, getFrame, specs, maxDpr, driveOnVideoFrames) => {
  const [failed, setFailed] = React.useState(false);
  const rendererRef = React.useRef(null);
  const generatorRef = React.useRef(null);
  const shape = specs[0];
  const state = React.useRef(specs);
  state.current = specs;

  const hasLiveGeometry = specs.some(
    (s) =>
      isGlassMotionValue(s.x) ||
      isGlassMotionValue(s.y) ||
      isGlassMotionValue(s.lensW) ||
      isGlassMotionValue(s.lensH) ||
      (s.radius != null && isGlassMotionValue(s.radius))
  );

  React.useLayoutEffect(() => {
    const out = outRef.current;
    const container = containerRef.current;
    if (!out || !container) return;
    let renderer;
    try {
      renderer = new GlassWebGLRenderer(out);
    } catch (err) {
      setFailed(true);
      return;
    }
    rendererRef.current = renderer;
    const dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
    const sync = () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      out.style.width = `${w}px`;
      out.style.height = `${h}px`;
      renderer.resize(Math.round(w * dpr), Math.round(h * dpr));
    };
    sync();
    const ro = new ResizeObserver(sync);
    ro.observe(container);
    return () => {
      ro.disconnect();
      renderer.dispose();
      rendererRef.current = null;
    };
  }, [outRef, containerRef, maxDpr]);

  const m0 = shape.merged;
  const shapeW = readGlassValue(shape.lensW);
  const shapeH = readGlassValue(shape.lensH);
  const shapeR = shape.radius != null ? readGlassValue(shape.radius) : Math.min(shapeW, shapeH);
  const shapeKey = JSON.stringify([
    m0.mapSize, shapeW, shapeH, shapeR, m0.depth, m0.clipToShape, m0.softEdge,
    m0.curvature, m0.splay, m0.glow, m0.glowSpread, m0.glowFalloff, m0.sheen,
    m0.sheenWidth, m0.sheenFalloff, m0.sheenAngle, m0.bend, m0.bendWidth,
  ]);

  React.useEffect(() => {
    const renderer = rendererRef.current;
    if (!renderer) return;
    if (!generatorRef.current) generatorRef.current = createLensMapGenerator(m0.mapSize);
    const url = generatorRef.current.generate({
      lensHalfWidth: shapeW,
      lensHalfHeight: shapeH,
      borderRadius: shapeR,
      depth: m0.depth,
      clipToShape: m0.clipToShape,
      softEdge: m0.softEdge,
      sheenAngle: m0.sheenAngle,
      glow: m0.glow,
      glowSpread: m0.glowSpread,
      glowFalloff: m0.glowFalloff,
      sheen: m0.sheen,
      sheenWidth: m0.sheenWidth,
      sheenFalloff: m0.sheenFalloff,
      curvature: m0.curvature,
      splay: m0.splay,
      bend: m0.bend,
      bendWidth: m0.bendWidth,
    });
    let stale = false;
    const img = new Image();
    img.onload = () => {
      if (!stale && rendererRef.current) rendererRef.current.setDisplacementMap(img);
    };
    img.src = url;
    return () => { stale = true; };
  }, [shapeKey, failed]);

  const keyOf = (s) => {
    const m = s.merged;
    const w = readGlassValue(s.lensW);
    const h = readGlassValue(s.lensH);
    const r = s.radius != null ? readGlassValue(s.radius) : Math.min(w, h);
    return JSON.stringify([
      m.mapSize, w, h, r, m.depth, m.clipToShape, m.softEdge, m.curvature,
      m.splay, m.glow, m.glowSpread, m.glowFalloff, m.sheen, m.sheenWidth,
      m.sheenFalloff, m.sheenAngle, m.bend, m.bendWidth,
    ]);
  };
  const lensKeys = specs.map(keyOf);
  const lensKeysRef = React.useRef(lensKeys);
  lensKeysRef.current = lensKeys;
  const perLensMaps = React.useRef(new Map());
  const perLensKey = lensKeys.join("|");

  React.useEffect(() => {
    const gen = generatorRef.current;
    if (!gen) return;
    const live = new Set(lensKeysRef.current);
    perLensMaps.current.forEach((img, key) => {
      if (!live.has(key)) {
        perLensMaps.current.delete(key);
        if (rendererRef.current) rendererRef.current.releaseDispMap(img);
      }
    });
    const defaultKey = lensKeysRef.current[0];
    const cleanups = [];
    const want = new Set();
    specs.forEach((s, i) => {
      const key = lensKeysRef.current[i];
      if (key === defaultKey || want.has(key) || perLensMaps.current.has(key)) return;
      want.add(key);
      const m = s.merged;
      const w = readGlassValue(s.lensW);
      const h = readGlassValue(s.lensH);
      const r = s.radius != null ? readGlassValue(s.radius) : Math.min(w, h);
      const url = gen.generate({
        lensHalfWidth: w,
        lensHalfHeight: h,
        borderRadius: r,
        depth: m.depth,
        clipToShape: m.clipToShape,
        softEdge: m.softEdge,
        sheenAngle: m.sheenAngle,
        glow: m.glow,
        glowSpread: m.glowSpread,
        glowFalloff: m.glowFalloff,
        sheen: m.sheen,
        sheenWidth: m.sheenWidth,
        sheenFalloff: m.sheenFalloff,
        curvature: m.curvature,
        splay: m.splay,
        bend: m.bend,
        bendWidth: m.bendWidth,
      });
      let stale = false;
      const img = new Image();
      img.onload = () => {
        if (!stale) perLensMaps.current.set(key, img);
      };
      img.src = url;
      cleanups.push(() => { stale = true; });
    });
    return () => cleanups.forEach((c) => c());
  }, [perLensKey, failed]);

  React.useEffect(() => () => {
    if (generatorRef.current) {
      generatorRef.current.dispose();
      generatorRef.current = null;
    }
  }, []);

  React.useEffect(() => {
    if (failed) return;
    let raf = 0;
    let vfc = 0;
    const v = driveOnVideoFrames;
    const useVfc = !!v && !hasLiveGeometry && typeof v.requestVideoFrameCallback === "function";

    const draw = () => {
      const renderer = rendererRef.current;
      const container = containerRef.current;
      if (!renderer || !container) return;
      const frame = getFrame();
      if (frame && frame.w > 0 && frame.h > 0) {
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const surfNorm = Math.sqrt((cw * cw + ch * ch) / 2);
        const keys = lensKeysRef.current;
        const descs = state.current.map((s, i) => {
          const lw = readGlassValue(s.lensW);
          const lh = readGlassValue(s.lensH);
          const rad = s.radius != null ? readGlassValue(s.radius) : Math.min(lw, lh);
          const sx = readGlassValue(s.x);
          const sy = readGlassValue(s.y);
          const ehw = lw * s.scale;
          const ehh = lh * s.scale;
          const ownsShape = i > 0 && keys[i] !== keys[0];
          const ownMap = ownsShape ? perLensMaps.current.get(keys[i]) : undefined;
          const flat = ownsShape && !ownMap;
          return {
            originX: (sx * cw - ehw) / cw,
            originY: 1 - (sy * ch + ehh) / ch,
            sizeX: (2 * ehw) / cw,
            sizeY: (2 * ehh) / ch,
            scaleX: flat ? 0 : ((s.merged.scaleX ?? s.merged.strength) * surfNorm) / cw,
            scaleY: flat ? 0 : ((s.merged.scaleY ?? s.merged.strength) * surfNorm) / ch,
            dispersion: s.merged.dispersion,
            specular: s.merged.specular,
            blur: s.merged.frost,
            cornerRadius: (rad * s.scale) / cw,
            opacity: s.opacity,
            brightness: s.merged.brightness,
            dispMap: ownMap,
          };
        });
        renderer.render(frame.source, frame.w, frame.h, descs);
      }
      if (useVfc) vfc = v.requestVideoFrameCallback(draw);
      else raf = requestAnimationFrame(draw);
    };

    if (useVfc) vfc = v.requestVideoFrameCallback(draw);
    else raf = requestAnimationFrame(draw);

    return () => {
      cancelAnimationFrame(raf);
      if (useVfc && vfc && v && v.cancelVideoFrameCallback) v.cancelVideoFrameCallback(vfc);
    };
  }, [failed, getFrame, containerRef, driveOnVideoFrames, hasLiveGeometry]);

  return failed;
};

const GlassSurface = ({
  src,
  draw,
  poster,
  loop = true,
  muted = true,
  autoPlay = true,
  crossOrigin,
  paused,
  videoRef: externalVideoRef,
  lenses,
  width,
  height,
  lens,
  lensW = 90,
  lensH = 90,
  borderRadius,
  x = 0.5,
  y = 0.5,
  maxDpr = 1.5,
  className,
  style,
  children,
}) => {
  const isVideo = src != null;
  const containerRef = React.useRef(null);
  const outRef = React.useRef(null);
  const videoRef = React.useRef(null);
  const [video, setVideo] = React.useState(null);

  const setVideoEl = React.useCallback(
    (el) => {
      videoRef.current = el;
      if (typeof externalVideoRef === "function") externalVideoRef(el);
      else if (externalVideoRef) externalVideoRef.current = el;
    },
    [externalVideoRef]
  );

  const srcRef = React.useRef(null);
  const drawRef = React.useRef(draw);
  drawRef.current = draw;
  const startRef = React.useRef(0);

  if (!isVideo && !srcRef.current && typeof document !== "undefined") {
    srcRef.current = document.createElement("canvas");
  }

  const specs = (
    lenses && lenses.length
      ? lenses.map((l) => ({
          lens: l.optics ? { ...lens, ...l.optics } : lens,
          lensW: l.w / 2,
          lensH: l.h / 2,
          borderRadius: l.radius,
          x: l.x,
          y: l.y,
          scale: l.scale,
          opacity: l.opacity,
        }))
      : [{ lens, lensW, lensH, borderRadius, x, y }]
  ).map(resolveLens);

  React.useEffect(() => {
    if (isVideo) setVideo(videoRef.current);
  }, [isVideo]);

  React.useEffect(() => {
    const v = videoRef.current;
    if (!isVideo || !v || paused === undefined) return;
    if (paused) v.pause();
    else void v.play().catch(() => {});
  }, [isVideo, paused]);

  const getFrame = React.useCallback(() => {
    if (isVideo) {
      const v = videoRef.current;
      if (!v || v.readyState < 2) return null;
      return { source: v, w: v.videoWidth, h: v.videoHeight };
    }
    const c = srcRef.current;
    const container = containerRef.current;
    if (!c || !container || !drawRef.current) return null;
    const w = width ?? Math.round(container.clientWidth);
    const h = height ?? Math.round(container.clientHeight);
    if (w === 0 || h === 0) return null;
    if (c.width !== w || c.height !== h) {
      c.width = w;
      c.height = h;
    }
    const ctx = c.getContext("2d");
    if (!ctx) return null;
    if (startRef.current === 0) startRef.current = performance.now();
    drawRef.current(ctx, performance.now() - startRef.current);
    return { source: c, w, h };
  }, [isVideo, width, height]);

  const failed = useLensRenderer(
    outRef,
    containerRef,
    getFrame,
    specs,
    maxDpr,
    isVideo ? video : null
  );

  return (
    <div
      ref={containerRef}
      className={className}
      style={{ position: "relative", overflow: "hidden", ...style }}
    >
      {isVideo && (
        <video
          ref={setVideoEl}
          src={src}
          poster={poster}
          loop={loop}
          muted={muted}
          autoPlay={autoPlay}
          playsInline
          crossOrigin={crossOrigin}
          style={{
            position: "absolute",
            inset: 0,
            width: "100%",
            height: "100%",
            objectFit: "cover",
            visibility: failed ? "visible" : "hidden",
          }}
        />
      )}
      <canvas
        ref={outRef}
        style={{
          position: "absolute",
          inset: 0,
          pointerEvents: "none",
          display: failed ? "none" : "block",
        }}
      />
      {!isVideo && failed && (
        <div
          style={{
            position: "absolute",
            inset: 0,
            display: "grid",
            placeItems: "center",
            color: "#888",
            fontSize: 13,
          }}
        >
          WebGL2 nem érhető el
        </div>
      )}
      {children != null && <div style={{ position: "absolute", inset: 0 }}>{children}</div>}
    </div>
  );
};

  bend: 0.45,
  bendWidth: 0.16,
  dispersion: 0.32,
  frost: 6,
  saturate: 1.15,
  sheen: 0.32,
  sheenWidth: 3,
  sheenFalloff: 1.5,
  glow: 0.1,
  glowSpread: 1,
  glowFalloff: 0.5,
