  }

  function createImageIdentifier(prefix){
    var random = window.crypto && typeof window.crypto.randomUUID === "function" ? window.crypto.randomUUID() : Math.random().toString(36).slice(2) + "_" + Date.now().toString(36);
    return (prefix || "image") + "_" + random;
  }

  function isDataImageUrl(value){
    return typeof value === "string" && /^data:image\/(?:png|jpe?g|gif|webp|avif);base64,/i.test(value);
  }

  function isImageStorageUrl(value){
    return typeof value === "string" && value.indexOf("image-storage://") === 0;
  }

  function imageStorageIdentifier(value){
    return isImageStorageUrl(value) ? value.slice("image-storage://".length) : "";
  }

  function readBlobAsDataUrl(blob){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result || "")); };
      reader.onerror = function(){ reject(new Error("A képadat nem olvasható.")); };
      reader.readAsDataURL(blob);
    });
  }

  function openImageStorage(){
    return new Promise(function(resolve, reject){
      if(!window.indexedDB){ reject(new Error("Az IndexedDB nem érhető el.")); return; }
      var request;
      try{ request = window.indexedDB.open(IMAGE_STORAGE_DATABASE, 1); }
      catch(error){ reject(error); return; }
      request.onupgradeneeded = function(){
        var database = request.result;
        if(!database.objectStoreNames.contains(IMAGE_STORAGE_STORE)) database.createObjectStore(IMAGE_STORAGE_STORE, {keyPath:"id"});
      };
      request.onsuccess = function(){ resolve(request.result); };
      request.onerror = function(){ reject(request.error || new Error("A képtároló megnyitása sikertelen.")); };
    });
  }

  function writeStoredImageAsset(asset){
    return openImageStorage().then(function(database){
      return new Promise(function(resolve, reject){
        var transaction = database.transaction(IMAGE_STORAGE_STORE, "readwrite");
        var request = transaction.objectStore(IMAGE_STORAGE_STORE).put(asset);
        request.onsuccess = function(){ resolve(asset); };
        request.onerror = function(){ reject(request.error || new Error("A képadat mentése sikertelen.")); };
        transaction.oncomplete = function(){ database.close(); };
        transaction.onerror = function(){ database.close(); };
        transaction.onabort = function(){ database.close(); };
      });
    });
  }

  function readStoredImageAsset(identifier){
    return openImageStorage().then(function(database){
      return new Promise(function(resolve, reject){
        var transaction = database.transaction(IMAGE_STORAGE_STORE, "readonly");
        var request = transaction.objectStore(IMAGE_STORAGE_STORE).get(identifier);
        request.onsuccess = function(){ resolve(request.result || null); };
        request.onerror = function(){ reject(request.error || new Error("A képadat betöltése sikertelen.")); };
        transaction.oncomplete = function(){ database.close(); };
        transaction.onerror = function(){ database.close(); };
        transaction.onabort = function(){ database.close(); };
      });
    });
  }

  function createImageDescriptor(url, metadata){
    var options = metadata || {};
    return {
      id: options.id || createImageIdentifier("asset"),
      url: url || "",
      thumbnailUrl: options.thumbnailUrl || url || "",
      name: options.name || "Kép",
      alt: options.alt || options.name || "Kép",
      mimeType: options.mimeType || "image/png",
      size: Number(options.size) || 0,
      storageId: options.storageId || options.storage_id || "",
      generated: !!options.generated,
      source: options.source || "attachment",
      createdAt: Number(options.createdAt) || Date.now()
    };
  }

  function descriptorFromImagePart(part){
    if(!part) return null;
    var image = part.image_url || part;
    if(typeof image === "string") return createImageDescriptor(image, {id:part.id, generated:!!part.generated, source:part.source || "conversation"});
    if(!image || typeof image !== "object") return null;
    var url = image.url || image.image_url || part.url || "";
    return createImageDescriptor(url, {
      id: part.id || image.id,
      thumbnailUrl: image.thumbnail_url || image.thumbnailUrl || part.thumbnail_url || url,
      name: image.name || part.name || "Kép",
      alt: image.alt || part.alt || image.name || part.name || "Kép",
      mimeType: image.mime_type || image.mimeType || part.mime_type || "image/png",
      size: image.size || part.size,
      storageId: image.storage_id || image.storageId || part.storage_id || part.storageId,
      generated: !!(part.generated || image.generated),
      source: part.source || image.source || "conversation",
      createdAt: part.created_at || image.created_at || part.createdAt
    });
  }

  function imagePartFromDescriptor(descriptor){
    var image = createImageDescriptor(descriptor.url, descriptor);
    return {
      type:"image_url",
      id:image.id,
      image_url:{
        url:image.url,
        thumbnail_url:image.thumbnailUrl,
        name:image.name,
        alt:image.alt,
        mime_type:image.mimeType,
        size:image.size,
        storage_id:image.storageId,
        generated:image.generated,
        source:image.source,
        created_at:image.createdAt
      },
      generated:image.generated,
      source:image.source
    };
  }

  function persistImageDescriptor(descriptor){
    if(!descriptor || !isDataImageUrl(descriptor.url)) return Promise.resolve(descriptor);
    if(descriptor.storageId) return Promise.resolve(descriptor);
    return fetch(descriptor.url).then(function(response){
      if(!response.ok) throw new Error("A képad nem olvasható.");
      return response.blob();
    }).then(function(blob){
      var storageId = createImageIdentifier("stored");
      return writeStoredImageAsset({
        id:storageId,
        blob:blob,
        name:descriptor.name,
        alt:descriptor.alt,
        mimeType:blob.type || descriptor.mimeType || "image/png",
        size:blob.size || descriptor.size || 0,
        createdAt:descriptor.createdAt || Date.now()
      }).then(function(){
        descriptor.storageId = storageId;
        descriptor.mimeType = blob.type || descriptor.mimeType;
        descriptor.size = blob.size || descriptor.size;
        return descriptor;
      });
    }).catch(function(){ return descriptor; });
  }

  function hydrateImageDescriptor(descriptor){
    if(!descriptor) return Promise.resolve(descriptor);
    var storageId = descriptor.storageId || imageStorageIdentifier(descriptor.url);
    if(!storageId) return Promise.resolve(descriptor);
    if(!isImageStorageUrl(descriptor.url) && isDataImageUrl(descriptor.url)) return Promise.resolve(descriptor);
    return readStoredImageAsset(storageId).then(function(record){
      if(!record || !record.blob) return descriptor;
      return readBlobAsDataUrl(record.blob).then(function(dataUrl){
        descriptor.url = dataUrl;
        descriptor.thumbnailUrl = descriptor.thumbnailUrl && !isImageStorageUrl(descriptor.thumbnailUrl) ? descriptor.thumbnailUrl : dataUrl;
        descriptor.storageId = storageId;
        descriptor.name = descriptor.name || record.name || "Kép";
        descriptor.alt = descriptor.alt || record.alt || descriptor.name;
        descriptor.mimeType = descriptor.mimeType || record.mimeType || record.blob.type || "image/png";
        descriptor.size = descriptor.size || record.size || record.blob.size || 0;
        return descriptor;
      });
    }).catch(function(){ return descriptor; });
  }

  function getImageDescriptors(content){
    if(!Array.isArray(content)) return [];
    return content.map(function(part){
      if(!part || (part.type !== "image_url" && part.type !== "input_image" && !part.image_url)) return null;
      return descriptorFromImagePart(part);
    }).filter(function(item){ return item && item.url; });
  }

  function hydrateContentImageAssets(content){
    if(!Array.isArray(content)) return Promise.resolve(content);
    var pending = [];
    content.forEach(function(part){
      if(!part || !part.image_url) return;
      var descriptor = descriptorFromImagePart(part);
      if(!descriptor) return;
      var hydrated = hydrateImageDescriptor(descriptor).then(function(result){
        if(!result) return;
        part.id = result.id;
        part.generated = result.generated;
        part.source = result.source;
        part.image_url = imagePartFromDescriptor(result).image_url;
        if(isDataImageUrl(result.url) && !result.storageId){
          return persistImageDescriptor(result).then(function(persisted){
            part.image_url = imagePartFromDescriptor(persisted).image_url;
          });
        }
      });
      pending.push(hydrated);
    });
    return Promise.all(pending).then(function(){ return content; });
  }

  function hydrateHistoryImageAssets(){
    var tasks = [];
    history.forEach(function(entry){
      if(!entry) return;
      if(Array.isArray(entry.messages)) entry.messages.forEach(function(message){ tasks.push(hydrateContentImageAssets(message && message.content)); });
      if(Array.isArray(entry.branches)) entry.branches.forEach(function(branch){
        if(Array.isArray(branch.messages)) branch.messages.forEach(function(message){ tasks.push(hydrateContentImageAssets(message && message.content)); });
      });
    });
    return Promise.all(tasks).then(function(){ saveHistory(); return history; }).catch(function(){ return history; });
  }

  function createDescriptorFromFile(file){
    if(!file || !SUPPORTED_IMAGE_MIME_TYPES[String(file.type || "").toLowerCase()]) return Promise.reject(new Error("Csak PNG, JPEG, WebP vagy GIF képfájl csatolható."));
    if(file.size > MAX_IMAGE_ATTACHMENT_BYTES) return Promise.reject(new Error("Egy kép legfeljebb 12 MB lehet."));
    return readBlobAsDataUrl(file).then(function(dataUrl){
      return persistImageDescriptor(createImageDescriptor(dataUrl, {
        name:file.name || "Csatolt kép",
        alt:file.name || "Csatolt kép",
        mimeType:file.type || "image/png",
        size:file.size || 0,
        source:"attachment"
      }));
    });
  }

  function imageData(file){
    return createDescriptorFromFile(file);
  }

  function queueImageForNextRequest(descriptor){
    if(!descriptor || !descriptor.url) return;
    var image = createImageDescriptor(descriptor.url, descriptor);
    var duplicate = selectedImages.some(function(item){ return item.url === image.url || (item.storageId && item.storageId === image.storageId); });
    if(!duplicate){
      if(selectedImages.length >= MAX_IMAGE_ATTACHMENT_COUNT){ toast("Legfeljebb " + MAX_IMAGE_ATTACHMENT_COUNT + " kép csatolható.", "err"); return; }
      selectedImages.push(image);
      updateImgStrip();
    }
    textarea.dispatchEvent(new Event("input", {bubbles:true}));
    textarea.focus();
    toast("A kép hozzáadva a következő kéréshez", "ok");
  }

  function descriptorToFile(descriptor){
    if(!descriptor || !descriptor.url) return Promise.reject(new Error("A szerkesztendő kép nem érhető el."));
    return fetch(descriptor.url).then(function(response){
      if(!response.ok) throw new Error("A kép nem tölthető le szerkesztéshez.");
      return response.blob();
    }).then(function(blob){
      var extension = (descriptor.mimeType || blob.type || "image/png").split("/")[1] || "png";
      return new File([blob], descriptor.name || ("szerkesztendo-kep." + extension), {type:blob.type || descriptor.mimeType || "image/png"});
    });
  }

  function normalizeImageResultItem(item, generated){
    if(typeof item === "string") return createImageDescriptor(item, {name:generated ? "Generált kép" : "Kép", generated:!!generated, source:generated ? "generated" : "conversation"});
    if(!item || typeof item !== "object") return null;
    var url = item.url || item.image_url || item.image || item.output_url || "";
    if(!url && item.b64_json) url = "data:image/png;base64," + item.b64_json;
    if(!url && item.base64) url = "data:image/png;base64," + item.base64;
    if(!url && item.data && typeof item.data === "string" && /^data:image\//i.test(item.data)) url = item.data;
    if(!url) return null;
    return createImageDescriptor(url, {
      id:item.id,
      thumbnailUrl:item.thumbnail_url || item.thumbnailUrl || url,
      name:item.name || (generated ? "Generált kép" : "Kép"),
      alt:item.alt || item.revised_prompt || item.prompt || item.name || (generated ? "Generált kép" : "Kép"),
      mimeType:item.mime_type || item.mimeType || "image/png",
      size:item.size,
      generated:!!generated,
      source:generated ? "generated" : "conversation"
    });
  }

  function extractGeneratedImageDescriptors(payload){
    var candidates = [];
    if(!payload) return Promise.resolve([]);
    if(payload.output_data) return extractGeneratedImageDescriptors(payload.output_data);
    if(Array.isArray(payload.image)) candidates = payload.image;
    else if(Array.isArray(payload)) candidates = payload;
    else if(Array.isArray(payload.data)) candidates = payload.data;
    else if(Array.isArray(payload.images)) candidates = payload.images;
    else if(Array.isArray(payload.output)) candidates = payload.output;
    else if(payload.output && Array.isArray(payload.output.images)) candidates = payload.output.images;
    else if(payload.choices && payload.choices[0] && payload.choices[0].message && Array.isArray(payload.choices[0].message.images)) candidates = payload.choices[0].message.images;
    else candidates = [payload];
    var descriptors = candidates.map(function(item){ return normalizeImageResultItem(item, true); }).filter(function(item){ return item && item.url; });
    return Promise.all(descriptors.map(function(descriptor){ return persistImageDescriptor(descriptor); }));
  }

  function imageApiError(response){
    return response.text().then(function(text){
      var message = "A képszolgáltatás hibát adott.";
      if(text){
        try{
          var body = JSON.parse(text);
          message = (body.error && (body.error.message || body.error)) || body.message || body.details || body.detail || text;
          if(typeof message !== "string") message = JSON.stringify(message);
        }catch(error){ message = text; }
      }
      var exception = new Error(String(message));
      exception.status = response.status;
      return exception;
    });
  }

  function requestImageEndpoint(paths, options){
    var index = 0;
    function attempt(){
      if(index >= paths.length) return Promise.reject(new Error("A képkészítő végpont nem érhető el."));
      var endpoint = paths[index++];
      return fetch(endpoint, options()).then(function(response){
        if(response.ok){
          var contentType = response.headers.get("content-type") || "";
          if(contentType.indexOf("text/event-stream") !== -1) return readFlyImageStream(response);
          if(contentType.indexOf("application/json") !== -1) return response.json();
          return response.text().then(function(text){
            try{ return JSON.parse(text); }catch(error){ return {data:[{url:text}]}; }
          });
        }
        if(response.status === 404 || response.status === 405) return attempt();
        return imageApiError(response).then(function(error){ return Promise.reject(error); });
      });
    }
    return attempt();
  }

  async function readFlyImageStream(response){
    var reader = response.body.getReader();
    var decoder = new TextDecoder();
    var buffer = "";
    var result = null;
    function consume(frame){
      var data = frame.split(/\r?\n/).filter(function(line){ return line.indexOf("data:") === 0; }).map(function(line){ return line.slice(5).trimStart(); }).join("\n");
      if(!data || data === "[DONE]") return;
      var event = JSON.parse(data);
      if(event.status >= 400 || event.details || event.error){
        var error = event.details || event.message || event.error;
        throw new Error(typeof error === "string" ? error : JSON.stringify(error));
      }
      if(event.output_data || Array.isArray(event.image)) result = event;
    }
    try{
      while(true){
        var chunk = await reader.read();
        buffer += chunk.done ? decoder.decode() : decoder.decode(chunk.value, {stream:true});
        var boundary;
        while((boundary = /\r?\n\r?\n/.exec(buffer))){
          consume(buffer.slice(0, boundary.index));
          buffer = buffer.slice(boundary.index + boundary[0].length);
        }
        if(chunk.done){ if(buffer.trim()) consume(buffer); break; }
      }
    }finally{ reader.releaseLock(); }
    if(!result) throw new Error("A FlyMyAI nem adott vissza képet.");
    return result;
  }

  function requestGeneratedImages(prompt, settings){
    return requestEditedImages(prompt, imageFlowState.image, settings);
  }

  function requestEditedImages(prompt, reference, settings){
    return descriptorToFile(reference).then(function(file){
      return requestImageEndpoint(["/api/images/edits"], function(){
        var form = new FormData();
        form.append("image", file, file.name || "image.png");
        form.append("prompt", prompt);
        form.append("size", settings.size);
        form.append("quality", settings.quality);
        return {method:"POST", credentials:"same-origin", body:form};
      });
    }).then(extractGeneratedImageDescriptors);
  }

  function imageContentFromDescriptors(text, descriptors){
    var parts = [{type:"text", text:text || ""}];
    descriptors.forEach(function(descriptor){ parts.push(imagePartFromDescriptor(descriptor)); });
    return parts;
  }

  function setImageFlowBusy(value){
    var closeButton = document.getElementById("image-flow-close");
    var cancelButton = document.getElementById("image-flow-cancel");
    var submitButton = document.getElementById("image-flow-submit");
    if(closeButton) closeButton.disabled = !!value;
    if(cancelButton) cancelButton.disabled = !!value;
    if(submitButton){
      submitButton.disabled = !!value;
      submitButton.textContent = value ? "Feldolgozás…" : (imageFlowState.mode === "edit" ? "Kép szerkesztése" : "Kép létrehozása");

  function renderImageFlowReference(descriptor){
    var reference = document.getElementById("image-flow-reference");
    if(!reference) return;
    if(!descriptor || !descriptor.url){
      reference.classList.remove("visible");
      reference.innerHTML = "";

    reference.classList.add("visible");
    reference.innerHTML = '<img src="' + escapeAttr(descriptor.thumbnailUrl || descriptor.url) + '" alt="' + escapeAttr(descriptor.alt || descriptor.name || "Referencia kép") + '"><span>' + escapeHtml(descriptor.name || "Referencia kép") + '</span>';
  }

  function openImageFlow(mode, descriptor, prompt){
    if(imageRequestInProgress){ toast("A képkérés még folyamatban van.", "inf"); return; }
    var modal = document.getElementById("image-flow-modal");
    var title = document.getElementById("image-flow-title");
    var promptLabel = document.getElementById("image-flow-prompt-label");
    var promptInput = document.getElementById("image-flow-prompt");
    if(!modal || !promptInput) return;
    imageFlowState = {mode:mode === "edit" ? "edit" : "generate", image:descriptor || selectedImages[0] || null, lastFocus:document.activeElement};
    var referenceInput = document.getElementById("image-flow-file");
    if(referenceInput) referenceInput.value = "";
    if(title) title.textContent = imageFlowState.mode === "edit" ? "Kép szerkesztése" : "Kép létrehozása";
    if(promptLabel) promptLabel.textContent = imageFlowState.mode === "edit" ? "Írd le a kívánt átalakítást" : "Írd le a létrehozandó képet";
    promptInput.placeholder = imageFlowState.mode === "edit" ? "Például: cseréld a hátteret alkonyati tengerpartra, tartsd meg az alanyt" : "Például: egy napfényes, minimalista kávézó növényekkel, filmes fényekkel";
    promptInput.value = prompt || "";
    renderImageFlowReference(imageFlowState.image);
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
    setImageFlowBusy(false);
    window.setTimeout(function(){ promptInput.focus(); }, 0);

  function closeImageFlow(force){
    if(imageRequestInProgress && !force) return;
    var modal = document.getElementById("image-flow-modal");
    if(!modal) return;
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
    var previousFocus = imageFlowState.lastFocus;
    imageFlowState = {mode:"generate", image:null, lastFocus:null};
    if(previousFocus && typeof previousFocus.focus === "function"){
      try{ previousFocus.focus(); }catch(error){}
    }
  }

  function submitImageFlow(){
    if(imageRequestInProgress) return;
    var promptInput = document.getElementById("image-flow-prompt");
    var sizeInput = document.getElementById("image-flow-size");
    var qualityInput = document.getElementById("image-flow-quality");
    var prompt = promptInput ? promptInput.value.trim() : "";
    if(!prompt){
      toast(imageFlowState.mode === "edit" ? "Adj meg szerkesztési utasítást." : "Adj meg képgenerálási leírást.", "err");
      if(promptInput) promptInput.focus();
      return;
    }
    if(!imageFlowState.image || !imageFlowState.image.url){
      toast("Válassz ki egy kiinduló képet.", "err");
      return;
    }
    imageRequestInProgress = true;
    setImageFlowBusy(true);
    var mode = imageFlowState.mode;
    var reference = imageFlowState.image;
    var settings = {size:sizeInput ? sizeInput.value : "1024x1024", quality:qualityInput ? qualityInput.value : "medium"};
    var pendingMessage = {role:"assistant", content:"", isImageRequest:true, imageRequestPending:true, imageOperation:mode, createdAt:Date.now()};
    messages.push(pendingMessage);
    render();
    var request = mode === "edit" ? requestEditedImages(prompt, reference, settings) : requestGeneratedImages(prompt, settings);
    request.then(function(descriptors){
      if(!descriptors.length) throw new Error("A képszolgáltatás nem adott vissza megjeleníthető képet.");
      pendingMessage.imageRequestPending = false;
      pendingMessage.isImageRequest = false;
      pendingMessage.generatedImagePresentation = true;
      pendingMessage.imageOperation = mode;
      pendingMessage.content = imageContentFromDescriptors(mode === "edit" ? "**Szerkesztett kép**" : "**Generált kép**", descriptors);
      persistCurrent();
      render();
      closeImageFlow(true);
      toast(mode === "edit" ? "A kép elkészült" : "A kép elkészült", "ok");

      if(language === "html" && character === "<"){
        clipboardPreviewHtmlTagPattern.lastIndex = index;
        var tag = clipboardPreviewHtmlTagPattern.exec(source);
        if(tag){ tokenParts.push(clipboardToken(tag[0], "tok-tag")); index += tag[0].length; continue; }
      }
      clipboardPreviewNumberPattern.lastIndex = index;
      var number = clipboardPreviewNumberPattern.exec(source);
      if(number){ tokenParts.push(clipboardToken(number[0], "tok-number")); index += number[0].length; continue; }
      var wordPattern = language === "css" || language === "yaml" ? clipboardPreviewHyphenWordPattern : clipboardPreviewWordPattern;
      wordPattern.lastIndex = index;
      var word = wordPattern.exec(source);
      if(word){
        var token = word[0];
        var lookahead = index + token.length;
        while(/\s/.test(source.charAt(lookahead))) lookahead++;
        var nextCharacter = source.charAt(lookahead);
        var wordClass = "";
        var keyword = language === "sql" || language === "css" ? token.toLowerCase() : token;
        if((language === "json" || language === "yaml" || language === "css") && nextCharacter === ":") wordClass = "tok-property";
        else if(clipboardPreviewConstantSets[language] && clipboardPreviewConstantSets[language][keyword]) wordClass = "tok-bool";
        else if(clipboardPreviewKeywordSets[language] && clipboardPreviewKeywordSets[language][keyword]) wordClass = "tok-keyword";
        else if((language === "javascript" || language === "typescript") && source.charAt(index - 1) === ".") wordClass = "tok-property";
        tokenParts.push(clipboardToken(token, wordClass));
        index += token.length;
        continue;
      }
      tokenParts.push(escapeHtml(character));
      index++;
    }
    return tokenParts.join("");
  }

  function renderClipboardPreviewLines(content, lines, language){
    clipboardPreviewRenderToken++;
    var token = clipboardPreviewRenderToken;
    if(clipboardPreviewRenderFrame) window.cancelAnimationFrame(clipboardPreviewRenderFrame);
    var code = document.createElement("code");
    code.className = "clipboard-preview-lines";
    code.setAttribute("data-language", language);
    content.setAttribute("aria-busy", "true");
    content.replaceChildren(code);
    var state = {blockComment:false, htmlComment:false, quote:"", multilineQuote:false};
    var lineIndex = 0;
    function appendBatch(){
      clipboardPreviewRenderFrame = 0;
      if(token !== clipboardPreviewRenderToken || !document.getElementById("clipboard-preview-modal").classList.contains("open")) return;
      var fragment = document.createDocumentFragment();
      var end = Math.min(lineIndex + 300, lines.length);
      while(lineIndex < end){
        var row = document.createElement("span");
        row.className = "clipboard-preview-line";
        var number = document.createElement("span");
        number.className = "clipboard-preview-line-number";
        number.setAttribute("aria-hidden", "true");
        number.textContent = String(lineIndex + 1);
        var source = document.createElement("span");
        source.className = "clipboard-preview-source";
        source.innerHTML = highlightClipboardPreviewLine(lines[lineIndex], language, state);
        row.appendChild(number);
        row.appendChild(source);
        fragment.appendChild(row);
        lineIndex++;
      }
      code.appendChild(fragment);
      if(lineIndex < lines.length){
        clipboardPreviewRenderFrame = window.requestAnimationFrame(appendBatch);
      }else{
        content.setAttribute("aria-busy", "false");
      }
    }
    clipboardPreviewRenderFrame = window.requestAnimationFrame(appendBatch);
  }

  function sanitizeForStorage(value){
    if(value == null) return value;
    if(typeof value === "string") return isDataImageUrl(value) ? "" : value;
    if(Array.isArray(value)) return value.map(sanitizeForStorage);
    if(typeof value === "object"){
      if(value.type === "image_url" && value.image_url){
        var descriptor = descriptorFromImagePart(value);
        var storedUrl = descriptor.url;
        if(isDataImageUrl(storedUrl)) storedUrl = descriptor.storageId ? "image-storage://" + descriptor.storageId : "";
        var safeDescriptor = createImageDescriptor(storedUrl, descriptor);
        safeDescriptor.thumbnailUrl = storedUrl;
        var safePart = imagePartFromDescriptor(safeDescriptor);
        safePart.generated = !!value.generated;
        safePart.source = value.source || descriptor.source;
        return safePart;
      }
      var output = {};
      for(var key in value){
        if(Object.prototype.hasOwnProperty.call(value, key)){
          var item = value[key];
          if((key === "url" || key === "thumbnail_url" || key === "thumbnailUrl") && isDataImageUrl(item)){
            var storageId = value.storage_id || value.storageId || "";
            output[key] = storageId ? "image-storage://" + storageId : "";
          } else {
            output[key] = sanitizeForStorage(item);
          }
        }
      }
      return output;
    }
    return value;
  }
  function saveHistory(){
    try{
      var safe = sanitizeForStorage(history);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(safe));
    }catch(e){
      try{
        var reduced = history.slice(0, Math.max(1, Math.floor(history.length / 2))).map(function(entry){
          var copy = sanitizeForStorage(entry);
          if(copy && Array.isArray(copy.messages)){
            copy.messages = copy.messages.map(function(m){
              if(!m) return m;
              var o = {};
              for(var k in m){ if(Object.prototype.hasOwnProperty.call(m, k) && k !== "timeline") o[k] = m[k]; }
              if(typeof o.content === "string" && o.content.length > 4000) o.content = o.content.slice(0, 4000);
              return o;
            });
          }
          if(copy && Array.isArray(copy.branches)){
            copy.branches = copy.branches.map(function(b){
              var bb = {id:b.id, label:b.label, parentBranchId:b.parentBranchId, forkIndex:b.forkIndex, messages:[]};
              if(Array.isArray(b.messages)) bb.messages = b.messages.slice(-20);
              return bb;
            });
          }
          return copy;
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(reduced));
        history = reduced;
        if(typeof toast === "function") toast("Előzmények csökkentve (tárhely)", "inf");
      }catch(e2){
        if(typeof toast === "function") toast("Nem sikerült menteni az előzményeket", "err");
      }
    }
  }

        signal: abortController.signal,

      });
      var responseJobId = response.headers.get("X-Chat-Job-Id");
      if(responseJobId && requestToken === abortController){
        activeChatJobId = responseJobId;
        if(pendingChatStopRequested){
          pendingChatStopRequested = false;
          await stopActiveBackendJob();
        }
      }
      if(!response.ok){
        var errorResult = await response.json().catch(function(){ return {}; });
        throw new Error(errorResult.error && errorResult.error.message ? errorResult.error.message : "A modell nem válaszolt.");
      }
      var responseType = response.headers.get("content-type") || "";
      if(responseType.indexOf("text/event-stream") === -1){
        var result = await response.json();
        if(result.conversation_id){
          conversationId = result.conversation_id;
          persistCurrent();
        }
        var assistantMessage = result.choices && result.choices[0] && result.choices[0].message;
        if(!assistantMessage || (typeof assistantMessage.content !== "string" && typeof assistantMessage.reasoning_content !== "string")) throw new Error("A modell válasza érvénytelen.");
        var parsedMessage = splitAssistantMessage(assistantMessage);

      }else{
        if(!response.body) throw new Error("A böngésző nem támogatja a válasz streamelését.");
        reader = response.body.getReader();
        var decoder = new TextDecoder();

        function processEventData(data){

          if(window.chatWorkEvent) window.chatWorkEvent(event);

             if(event.conversation_id){
               conversationId = event.conversation_id;
               persistCurrent();
             }
             if(!event.job_id) return;
            if(requestToken === abortController) activeChatJobId = event.job_id;
            return;
          }
           if(event.type === "route") return;
          if(event.type === "agent_event"){
            var agentEvent = event.event || {};
            var eventType = agentEvent.type || "agent_event";
            if(eventType === "tool_start"){
                recordToolEvent(streamingMessage, agentEvent);
               setToolActivity(streamingMessage, agentEvent.tool);
               persistCurrent();
               render();
              return;
             }
             if(eventType === "tool_result"){
                recordToolEvent(streamingMessage, agentEvent);
               clearToolActivity(streamingMessage, agentEvent.tool);
               persistCurrent();
               render();
               return;
             }
             if(eventType === "artifact" && agentEvent.artifact){
              var artifact = agentEvent.artifact;
              if(artifact.artifact_id){
                var artifactName = String(artifact.name || "Letöltés").replace(/[\[\]]/g, "");
                streamingMessage.content += "\n\n[" + artifactName + "](/api/artifacts/" + encodeURIComponent(artifact.artifact_id) + ")";
              }
               scheduleStreamRender(streamingMessage);
            }
            return;
          }
          if(event.choices && event.choices[0] && event.choices[0].delta){
            var delta = event.choices[0].delta;
            event = {
              type: "delta",
              content: typeof delta.content === "string" ? delta.content : undefined,
              reasoning_content: typeof delta.reasoning_content === "string" ? delta.reasoning_content : (typeof delta.reasoning === "string" ? delta.reasoning : undefined),
               tool_call: delta.tool_call || (Array.isArray(delta.tool_calls) ? delta.tool_calls[0] : undefined),
               tool: delta.tool,
               finish_reason: event.choices[0].finish_reason
            };
             if(event.finish_reason) event.type = "done";
          }
          if(event.type === "delta" || (!event.type && (event.content || event.reasoning_content || event.tool_call || event.tool))){
            receivedAny = true;
            if(typeof event.reasoning_content === "string" && event.reasoning_content){
              streamingMessage.thinking += event.reasoning_content;
              if(!streamingMessage.thinkingManual) streamingMessage.thinkingOpen = true;
            }
            if(typeof event.content === "string" && event.content){
              streamingMessage.content += event.content;
              var visible = event.content.replace(/<think>[\s\S]*?<\/think>/g, "").replace(/<think>[\s\S]*$/g, "").trim();
              if(visible){
                if(!streamingMessage.thinkingEndedAt) streamingMessage.thinkingEndedAt = Date.now();
                if(!streamingMessage.thinkingManual) streamingMessage.thinkingOpen = true;
              } else {
                if(!streamingMessage.thinkingManual) streamingMessage.thinkingOpen = true;
              }
            }
            if(event.tool_call || event.tool){
              setToolActivity(streamingMessage, toolNameFromCall(event.tool_call || event.tool));
            }
            scheduleStreamRender(streamingMessage);
          }else if(event.type === "error"){
            throw new Error(event.message || "A modell streamelése megszakadt.");
          }else if(event.type === "done"){
            clearToolActivity(streamingMessage);
            streamingMessage.thinkingEndedAt = streamingMessage.thinkingEndedAt || Date.now();
            streamDone = true;
          }
        }
        while(!streamDone){
          var readResult = await reader.read();
          if(readResult.done) break;
          streamBuffer += decoder.decode(readResult.value, {stream:true});
          streamBuffer = streamBuffer.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
          var events = streamBuffer.split(/\n\n/);
          streamBuffer = events.pop() || "";
          events.forEach(function(rawEvent){
            var data = rawEvent.split(/\n/).filter(function(line){ return line.indexOf("data:") === 0; }).map(function(line){ return line.slice(5).trim(); }).join("\n");
            processEventData(data);
          });
        }
        streamBuffer += decoder.decode();
        streamBuffer = streamBuffer.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
        if(streamBuffer.trim()){
          var finalEvents = streamBuffer.split(/\n\n/);
          finalEvents.forEach(function(rawEvent){
            var data = rawEvent.split(/\n/).filter(function(line){ return line.indexOf("data:") === 0; }).map(function(line){ return line.slice(5).trim(); }).join("\n");
            processEventData(data);
          });
          streamBuffer = "";
        }
        if(!receivedAny && !streamingMessage.content && !streamingMessage.thinking){
          throw new Error("Üres válasz a modelltől.");
        }
      }
      streamingMessage.thinkingEndedAt = streamingMessage.thinkingEndedAt || Date.now();
      streamingMessage.isStreaming = false;
      clearToolActivity(streamingMessage);
      if(requestToken === abortController && requestBranchId === activeBranchId){
        render();
        persistCurrent();
      } else {
        syncActiveBranch();
        persistCurrent();
      }
    }catch(error){
      var stillActive = (requestToken === abortController) && (requestBranchId === activeBranchId);
      streamingMessage.isStreaming = false;
      streamingMessage.thinkingEndedAt = streamingMessage.thinkingEndedAt || Date.now();
      clearToolActivity(streamingMessage);
      if(!stillActive){
        syncActiveBranch();
        persistCurrent();
      } else if(error.name === "AbortError"){
        if(streamingMessage.content || streamingMessage.thinking){
          render();
          persistCurrent();
        }else{
          messages = messages.filter(function(message){ return message !== streamingMessage; });
          render();
          persistCurrent();
        }
      }else{
        messages = messages.filter(function(message){ return message !== streamingMessage; });
        messages.push({role:"assistant", content:"Hiba: " + error.message, isError:true});
        render();
        persistCurrent();
        toast(error.message || "Hiba", "err");
      }
    }finally{
      if(reader){
        try{ reader.cancel(); }catch(e){}
        try{ reader.releaseLock(); }catch(e){}
      }
      if(requestToken === abortController){
        stopStreamRenderTimer();
        abortController = null;
        activeChatJobId = null;
        pendingChatStopRequested = false;
        setBusy(false);
      }
    }
  }

  textarea.addEventListener("input", function(){
    textarea.style.height = "auto";
    var expandedLimit = textarea.classList.contains("large-paste-expanded") ? Math.min(window.innerHeight * .42, 360) : 160;
    textarea.style.height = Math.min(textarea.scrollHeight, expandedLimit) + "px";
    if(textarea.value.length < LARGE_CLIPBOARD_TEXT_LIMIT){

  sendButton.addEventListener("click", send);

  var fg = document.getElementById("fg");
  var fgFiles = document.getElementById("fg-files");
  var fgCamera = document.getElementById("fg-camera");

  function addSelectedImageFiles(files){
    var inputFiles = Array.prototype.slice.call(files || []);
    if(!inputFiles.length) return Promise.resolve();
    var imageFiles = inputFiles.filter(function(file){ return file && SUPPORTED_IMAGE_MIME_TYPES[String(file.type || "").toLowerCase()]; });
    if(inputFiles.length > imageFiles.length) toast("Csak PNG, JPEG, WebP vagy GIF képfájl csatolható.", "inf");
    var remaining = Math.max(0, MAX_IMAGE_ATTACHMENT_COUNT - selectedImages.length);
    if(!remaining){ toast("Legfeljebb " + MAX_IMAGE_ATTACHMENT_COUNT + " kép csatolható.", "err"); return Promise.resolve(); }
    if(imageFiles.length > remaining){
      imageFiles = imageFiles.slice(0, remaining);
      toast("Csak " + remaining + " további kép adható hozzá.", "inf");
    }
    return Promise.all(imageFiles.map(function(file){
      return imageData(file).then(function(descriptor){ return {descriptor:descriptor, error:null}; }).catch(function(error){ return {descriptor:null, error:error}; });
    })).then(function(results){
      var failed = 0;
      results.forEach(function(result){
        if(result.descriptor) selectedImages.push(result.descriptor);
        else failed++;
      });
      if(failed) toast(failed + " kép beolvasása sikertelen", "err");
      updateImgStrip();
      textarea.dispatchEvent(new Event("input", {bubbles:true}));
    });
  }

  [fg, fgFiles, fgCamera].forEach(function(fileInput){
    if(fileInput){
      fileInput.addEventListener("change", function(event){
        addSelectedImageFiles(event.target.files).catch(function(){ toast("Képolvasási hiba", "err"); });

  [textarea, document.getElementById("ib-wrap")].forEach(function(target){

    });
    target.addEventListener("drop", function(event){

      event.preventDefault();
      addSelectedImageFiles(event.dataTransfer.files).catch(function(){ toast("Képolvasási hiba", "err"); });
    });
  });
  window.handleLargeClipboardChoice = function(choice, clipboardText){
    var content = String(clipboardText == null ? "" : clipboardText);
    if(choice === "file"){
      selectedTextFiles.push({name:"clipboard.txt", text:content, mimeType:"text/plain;charset=utf-8"});
      updateImgStrip();

      textarea.focus();
      toast("Szövegfájl csatolva", "ok");
      return;
    }
    if(choice !== "text") return;
    var start = Number.isInteger(textarea.selectionStart) ? textarea.selectionStart : textarea.value.length;
    var end = Number.isInteger(textarea.selectionEnd) ? textarea.selectionEnd : start;
    textarea.setRangeText(content, start, end, "end");
    textarea.classList.add("large-paste-expanded");

    if(inputBox) inputBox.classList.add("large-paste-expanded");

    window.setTimeout(function(){
      textarea.focus();

      textarea.setSelectionRange(cursor, cursor);
      if(typeof textarea.scrollIntoView === "function") textarea.scrollIntoView({block:"nearest", behavior:"smooth"});
    }, 80);
  };
  if(textarea){
    textarea.addEventListener("paste", function(event){
      var clipboard = event.clipboardData;
      if(!clipboard) return;
      var files = [];
      for(var index = 0; clipboard.items && index < clipboard.items.length; index++){
        var item = clipboard.items[index];
        if(item.type && item.type.indexOf("image/") === 0){
          var file = item.getAsFile();
          if(file) files.push(file);
        }
      }
      if(files.length){
        event.preventDefault();
        addSelectedImageFiles(files).catch(function(){ toast("Képolvasási hiba", "err"); });
        return;
      }
      var clipboardText = clipboard.getData("text/plain") || clipboard.getData("text") || "";
      if(clipboardText.length >= LARGE_CLIPBOARD_TEXT_LIMIT){
        event.preventDefault();
        if(typeof window.showLargeClipboardSheet === "function") window.showLargeClipboardSheet(clipboardText);
      }
    });
  }
  var stb = document.getElementById("stb");
  if(stb){
    stb.addEventListener("click", function(){
      if(scrollArea) scrollArea.scrollTo({ top: scrollArea.scrollHeight, behavior: "smooth" });
    });
  }
  if(scrollArea){
    scrollArea.addEventListener("scroll", updateScrollButton, { passive: true });
  }

   resetBranches();
   loadHistory();
   hydrateHistoryImageAssets().then(function(){
     if(window.renderHistoryList) window.renderHistoryList();
     if(currentId) render();
   });
   bindImageFlowControls();
  function updateResumedMessage(message, event){
    if(window.chatWorkEvent) window.chatWorkEvent(event);
    if(event.type === "meta"){
      if(event.job_id) activeChatJobId = event.job_id;
      return;
    }else if(event.type === "route"){
      return;
    }else if(event.type === "agent_event"){
      var agentEvent = event.event || {};
      var type = agentEvent.type || "agent_event";
      if(type === "tool_start"){
        recordToolEvent(message, agentEvent);
        setToolActivity(message, agentEvent.tool);
        persistCurrent();
        render();
        return;
      }
      if(type === "tool_result"){
        recordToolEvent(message, agentEvent);
        clearToolActivity(message, agentEvent.tool);
        persistCurrent();
        render();
        return;
      }
      if(type === "artifact" && agentEvent.artifact){
        var artifact = agentEvent.artifact;
        if(artifact.artifact_id){
          var name = String(artifact.name || "Letöltés").replace(/[\[\]]/g, "");
          var link = "[" + name + "](/api/artifacts/" + encodeURIComponent(artifact.artifact_id) + ")";
          if(String(message.content || "").indexOf(link) === -1) message.content += "\n\n" + link;
        }
        scheduleStreamRender(message);
      }
      return;
    }else if(event.type === "delta" || (!event.type && (event.content || event.reasoning_content || event.tool_call || event.tool))){
      if(typeof event.reasoning_content === "string"){
        message.thinking = (message.thinking || "") + event.reasoning_content;
        if(!message.thinkingManual) message.thinkingOpen = true;
      }
      if(typeof event.content === "string"){
        message.content += event.content;
        message.thinkingEndedAt = message.thinkingEndedAt || Date.now();
        if(!message.thinkingManual) message.thinkingOpen = true;
      }
      if(event.tool_call || event.tool) setToolActivity(message, toolNameFromCall(event.tool_call || event.tool));
    }else if(event.type === "done"){
      message.isStreaming = false;
      message.thinkingEndedAt = message.thinkingEndedAt || Date.now();
      clearToolActivity(message);
    }else if(event.type === "error"){
      message.isStreaming = false;
      message.isError = true;
      message.content = message.content || ("Hiba: " + (event.message || "A Work-feladat hibával leállt."));
      message.thinkingEndedAt = message.thinkingEndedAt || Date.now();
      clearToolActivity(message);
    }else{
      return;
    }
    scheduleStreamRender(message);
  }
  function resumeWorkStream(job, message, controller){
    var cursor = Number(job.last_event_id || 0);
    var terminal = false;
    function dispatch(block){
      var idLine = block.split(/\n/).filter(function(line){ return line.indexOf("id:") === 0; })[0];
      if(idLine){
        var parsedId = parseInt(idLine.slice(3).trim(), 10);
        if(Number.isFinite(parsedId)) cursor = Math.max(cursor, parsedId);
      }
      var data = block.split(/\n/).filter(function(line){ return line.indexOf("data:") === 0; }).map(function(line){ return line.slice(5).trim(); }).join("\n");
      if(!data) return;
      var event;
      try{ event = JSON.parse(data); }catch(error){ return; }
      updateResumedMessage(message, event);
      if(event.type === "done" || event.type === "error"){
        terminal = true;
        message.isStreaming = false;
        activeChatJobId = null;
        abortController = null;
        stopStreamRenderTimer();
        setBusy(false);
        render();
        persistCurrent();
      }
    }
    async function connect(){
      while(!terminal && message.isStreaming && activeChatJobId === job.job_id && controller === abortController){
        try{
          var response = await fetch("/api/chat/jobs/" + encodeURIComponent(job.job_id) + "/events?after=" + encodeURIComponent(cursor), {
            headers:{"Accept":"text/event-stream"},
            signal:controller.signal,
            credentials:"same-origin"
          });
          if(!response.ok) throw new Error("A Work-feladat eseményfolyama nem érhető el.");
          var reader = response.body.getReader();
          var decoder = new TextDecoder();
          var buffer = "";
          while(!terminal){
            var result = await reader.read();
            if(result.done) break;
            buffer += decoder.decode(result.value, {stream:true}).replace(/\r\n/g, "\n").replace(/\r/g, "\n");
            var blocks = buffer.split(/\n\n/);
            buffer = blocks.pop() || "";
            blocks.forEach(dispatch);
          }
          if(buffer.trim()) dispatch(buffer);
          if(!terminal) await new Promise(function(resolve){ setTimeout(resolve, 900); });
        }catch(error){
          if(error.name === "AbortError") return;
          await new Promise(function(resolve){ setTimeout(resolve, 1200); });
        }
      }
    }
    connect();
  }
  function restoreWorkTask(job){
    if(!job || job.status !== "running") return;
    var conversation = history.find(function(item){ return item.conversation_id === job.conversation_id; });
    if(!conversation) return;
    if(currentId !== conversation.id){
      currentId = conversation.id;
      conversationId = conversation.conversation_id || conversation.id;
      loadBranches(conversation);
    }
    var message = messages.length && messages[messages.length - 1].role === "assistant" ? messages[messages.length - 1] : null;
    if(!message){
      message = {role:"assistant", content:"", thinking:"", isStreaming:true, thinkingOpen:true};
      messages.push(message);
    }
    message.content = job.response_content || message.content || "";
    message.thinking = job.response_reasoning || message.thinking || "";
    message.isStreaming = true;
    message.thinkingOpen = true;
    activeChatJobId = job.job_id;
    if(abortController) abortController.abort();
    abortController = new AbortController();
    setBusy(true);
    render();
    persistCurrent();
    resumeWorkStream(job, message, abortController);
  }
  function syncWithBackend(remoteConversations){
    var activeJobs = [];
    (remoteConversations || []).forEach(function(remote){
      if(!remote || !remote.conversation_id) return;
      var entry = history.find(function(item){ return item.conversation_id === remote.conversation_id || item.id === remote.conversation_id; });
      if(!entry){
        entry = {id:remote.conversation_id, title:remote.title || "Beszélgetés", messages:[], branches:[], updated:0, conversation_id:remote.conversation_id, pinned:false};
        history.push(entry);
      }
      entry.conversation_id = remote.conversation_id;
      entry.title = remote.title || entry.title;
      if(!Array.isArray(entry.messages) || !entry.messages.length) entry.messages = Array.isArray(remote.messages) ? remote.messages.slice() : [];
      else if(Array.isArray(remote.messages) && remote.messages.length > entry.messages.length){
        entry.messages = entry.messages.concat(remote.messages.slice(entry.messages.length));
      }
      entry.updated = Math.max(Number(entry.updated || 0), Date.parse(remote.updated_at || "") || 0);
      entry.latest_job = remote.latest_job || null;
      if(remote.latest_job){
        var job = remote.latest_job;
        entry.active_job_id = job.status === "running" ? job.job_id : null;
        var lastUserIndex = -1;
        for(var i = entry.messages.length - 1; i >= 0; i--){
          if(entry.messages[i] && entry.messages[i].role === "user"){ lastUserIndex = i; break; }
        }
        var answer = entry.messages.length - 1 > lastUserIndex && entry.messages[entry.messages.length - 1].role === "assistant" ? entry.messages[entry.messages.length - 1] : null;
        if(job.status === "running" && !answer){
          answer = {role:"assistant", content:"", thinking:"", isStreaming:true, thinkingOpen:true};
          entry.messages.push(answer);
        }
        if(answer){
          answer.content = job.response_content || answer.content || "";
          answer.thinking = job.response_reasoning || answer.thinking || "";
          answer.isStreaming = job.status === "running";
          if(job.status === "failed"){
            answer.isError = true;
            answer.content = answer.content || ("Hiba: " + (job.error || "A Work-feladat hibával leállt."));
          }else if(job.status === "cancelled" && !answer.content){
            answer.content = "A Work-feladat megszakítva.";
          }
        }
        if(job.status === "running") activeJobs.push(job);
      }
      if(Array.isArray(entry.branches) && entry.activeBranchId){
        var branch = entry.branches.find(function(item){ return item.id === entry.activeBranchId; });
        if(branch) branch.messages = entry.messages.slice();
      }
    });
    history.sort(function(a,b){ return Number(b.updated || 0) - Number(a.updated || 0); });
    if(!currentId && activeJobs.length){
      var active = activeJobs[0];
      var current = history.find(function(item){ return item.conversation_id === active.conversation_id; });
      if(current){
        currentId = current.id;
        conversationId = current.conversation_id;
        loadBranches(current);
      }
    }else if(currentId){
      var selected = history.find(function(item){ return item.id === currentId; });
      if(selected){
        conversationId = selected.conversation_id || selected.id;
        loadBranches(selected);
      }
    }
    saveHistory();
    if(window.renderHistoryList) window.renderHistoryList();
    render();
    if(activeJobs.length){
      var currentJob = activeJobs.find(function(job){ return job.conversation_id === conversationId; }) || activeJobs[0];
      restoreWorkTask(currentJob);
    }
  }
  window.chatApp = {
    newConversation: newConversation,
    loadConversation: loadConversation,
    deleteConversation: deleteConversation,
    persistCurrent: persistCurrent,
    getHistory: function(){ return history; },
    getCurrentId: function(){ return currentId; },
    getConversationId: function(){ return conversationId; },
    syncWithBackend: syncWithBackend,
    send: send,
    openImageFlow: openImageFlow,
    useConversationImage: queueImageForNextRequest,
    toast: toast
  };

})();
</script>

<script>
(function(){
  "use strict";

  var sbOpen = false;
  var searchOpen = false;
  var searchQuery = "";

  function $(id){ return document.getElementById(id); }

  var sidebarEl = $("sidebar");
  var contentEl = $("content");
  var sidebarBackdropEl = $("sidebar-backdrop");

  function openSB(){
    if(!sidebarEl) return;
    sbOpen = true;
    sidebarEl.classList.add("open");
    sidebarEl.setAttribute("aria-hidden", "false");
    if(sidebarBackdropEl){
      sidebarBackdropEl.classList.add("open");
      sidebarBackdropEl.setAttribute("aria-hidden", "false");
    }
    if(contentEl) contentEl.setAttribute("inert", "");
    renderHistoryList();
  }

  function closeSB(){
    if(!sidebarEl) return;
    sbOpen = false;
    sidebarEl.classList.remove("open");
    sidebarEl.setAttribute("aria-hidden", "true");
    if(sidebarBackdropEl){
      sidebarBackdropEl.classList.remove("open");
      sidebarBackdropEl.setAttribute("aria-hidden", "true");
    }
    if(contentEl) contentEl.removeAttribute("inert");
    if(searchOpen) closeSearch();
  }

  if(sidebarBackdropEl){
    sidebarBackdropEl.addEventListener("click", closeSB);
  }

  function openSearch(){
    searchOpen = true;
    var bar = $("sb-search-bar");
    if(bar) bar.classList.add("open");
    requestAnimationFrame(function(){
      var q = $("sb-q");
      if(q) q.focus();
    });
  }

  function closeSearch(){
    searchOpen = false;
    searchQuery = "";
    var q = $("sb-q");
    if(q) q.value = "";
    var bar = $("sb-search-bar");
    if(bar) bar.classList.remove("open");
    if(q) q.blur();
    renderHistoryList();
  }

  var btnSbSearch = $("btn-sb-search");
  if(btnSbSearch){
    btnSbSearch.addEventListener("click", function(){
      if(searchOpen) closeSearch(); else openSearch();
    });
  }
  var sbQCancel = $("sb-q-cancel");
  if(sbQCancel){
    sbQCancel.addEventListener("click", closeSearch);
  }

  var searchDebounce = null;
  var sbQ = $("sb-q");
  if(sbQ){
    sbQ.addEventListener("input", function(e){
      var val = e.target.value;
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(function(){
        searchQuery = val;
        renderHistoryList();
      }, 100);
    });
  }

  function updateSearchStatus(count, q){
    var st = $("search-status");
    if(!st) return;
    if(!q){ st.textContent = ""; return; }
    st.textContent = count === 0 ? "Nincs találat: " + q : count + " találat: " + q;
  }

  function formatMeta(ts){
    if(!ts) return "";
    var d = new Date(ts);
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    if(sameDay) return d.toLocaleTimeString("hu-HU", { hour: "2-digit", minute: "2-digit" });
    return d.toLocaleDateString("hu-HU", { month: "short", day: "numeric" });
  }

  function renderHistoryList(){
    var list = $("hlist");
    if(!list) return;
    var hist = (window.chatApp && window.chatApp.getHistory) ? window.chatApp.getHistory() : [];
    var cur = (window.chatApp && window.chatApp.getCurrentId) ? window.chatApp.getCurrentId() : null;
    var q = (searchQuery || "").trim().toLowerCase();
    var filtered = hist.filter(function(h){
      if(!q) return true;
      var title = (h.title || "").toLowerCase();
      if(title.indexOf(q) !== -1) return true;
      if(Array.isArray(h.messages)){
        for(var i = 0; i < h.messages.length; i++){
          var c = h.messages[i].content;
          var t = typeof c === "string" ? c : (Array.isArray(c) ? c.map(function(p){ return p && p.text || ""; }).join(" ") : "");
          if(String(t).toLowerCase().indexOf(q) !== -1) return true;
        }
      }
      return false;
    });
    updateSearchStatus(filtered.length, q);
    if(!filtered.length){
      list.innerHTML = '<div class="h-empty"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><p>' + (q ? "Nincs találat" : "Még nincsenek beszélgetések") + '</p></div>';
      return;
    }
    list.innerHTML = filtered.map(function(h){
      var active = h.id === cur ? " active" : "";
      var pinned = h.pinned ? " pinned" : "";
      var rawTitle = h.title || "Beszélgetés";
      var meta = formatMeta(h.updated);
      var markTitle;
      if(q){
        var re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
        var parts = [];
        var last = 0;
        var match;
        while((match = re.exec(rawTitle)) !== null){
          parts.push(escapeHtmlAttr(rawTitle.slice(last, match.index)));
          parts.push("<mark>" + escapeHtmlAttr(match[0]) + "</mark>");
          last = match.index + match[0].length;
        }
        parts.push(escapeHtmlAttr(rawTitle.slice(last)));
        markTitle = parts.join("");
      } else {
        markTitle = escapeHtmlAttr(rawTitle);
      }
      return '<div class="hcard' + active + pinned + '" data-id="' + escapeHtmlAttr(h.id) + '" role="button" tabindex="0">' +
        '<div class="hcard-body"><div class="hcard-pre"><span class="hcard-pin"><svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg></span>' + markTitle + '</div>' +
        '<div class="hcard-meta">' + escapeHtmlAttr(meta) + '</div></div>' +
        '<button type="button" class="hcard-del" data-id="' + escapeHtmlAttr(h.id) + '" aria-label="Törlés"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button></div>';
    }).join("");

    list.querySelectorAll(".hcard").forEach(function(card){
      card.addEventListener("click", function(e){
        if(e.target.closest(".hcard-del")) return;
        var id = card.getAttribute("data-id");
        if(id && window.chatApp) window.chatApp.loadConversation(id);
      });
      card.addEventListener("contextmenu", function(e){
        e.preventDefault();
        showCtxMenu(e.clientX, e.clientY, card.getAttribute("data-id"));
      });
    });
    list.querySelectorAll(".hcard-del").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var id = btn.getAttribute("data-id");
        openActionSheet("Beszélgetés törlése", "Biztosan törölni szeretnéd?", [
          { label: "Törlés", destructive: true, action: function(){ if(window.chatApp) window.chatApp.deleteConversation(id); } }
        ]);
      });
    });
  }

  function escapeHtmlAttr(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c];
    });
  }

  function openActionSheet(title, message, options){
    var sheet = $("action-sheet");
    var titleEl = $("as-title");
    var msgEl = $("as-message");
    var titleBlock = $("as-title-block");
    var optsEl = $("as-options");
    if(!sheet || !optsEl) return;
    var rememberRow = $("clipboard-remember-row");
    var rememberInput = $("clipboard-remember");
    sheet.classList.remove("large-text-sheet");
    if(rememberRow) rememberRow.style.display = "none";
    if(rememberInput) rememberInput.checked = false;
    if(titleEl) titleEl.textContent = title || "";
    if(msgEl){
      if(message){ msgEl.textContent = message; msgEl.style.display = ""; }
      else { msgEl.style.display = "none"; }
    }
    if(titleBlock) titleBlock.style.display = title ? "" : "none";
    optsEl.innerHTML = "";
    (options || []).forEach(function(opt){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "as-option" + (opt.destructive ? " destructive" : "");
      b.textContent = opt.label;
      b.addEventListener("click", function(){
        closeActionSheet();
        if(typeof opt.action === "function") opt.action();
      });
      optsEl.appendChild(b);
    });
    sheet.setAttribute("aria-hidden", "false");
  }

  window.showLargeClipboardSheet = function(text){
    var content = String(text == null ? "" : text);
    if(!content) return;
    var rememberedChoice = "";
    try{ rememberedChoice = localStorage.getItem("large_clipboard_text_choice_v1") || ""; }catch(error){}
    if((rememberedChoice === "file" || rememberedChoice === "text") && typeof window.handleLargeClipboardChoice === "function"){
      window.handleLargeClipboardChoice(rememberedChoice, content);
      return;
    }
    var rememberRow = $("clipboard-remember-row");
    var rememberInput = $("clipboard-remember");
    var sheet = $("action-sheet");
    openActionSheet("Nagyméretű szöveg", "", [
      {label:"Csatolás fájlként", action:function(){
        var shouldRemember = !!(rememberInput && rememberInput.checked);
        if(shouldRemember){ try{ localStorage.setItem("large_clipboard_text_choice_v1", "file"); }catch(error){} }
        if(typeof window.handleLargeClipboardChoice === "function") window.handleLargeClipboardChoice("file", content);
      }},
      {label:"Beillesztés szövegként", action:function(){
        var shouldRemember = !!(rememberInput && rememberInput.checked);
        if(shouldRemember){ try{ localStorage.setItem("large_clipboard_text_choice_v1", "text"); }catch(error){} }
        if(typeof window.handleLargeClipboardChoice === "function") window.handleLargeClipboardChoice("text", content);
      }}
    ]);
    if(rememberInput) rememberInput.checked = false;
    if(rememberRow) rememberRow.style.display = "flex";
    if(sheet) sheet.classList.add("large-text-sheet");
  };

  function closeActionSheet(){
    var sheet = $("action-sheet");
    if(sheet){
      sheet.setAttribute("aria-hidden", "true");
      sheet.classList.remove("large-text-sheet");
    }
    var rememberRow = $("clipboard-remember-row");
    if(rememberRow) rememberRow.style.display = "none";
  }

  var asCancel = $("as-cancel");
  if(asCancel) asCancel.addEventListener("click", closeActionSheet);
  var asBackdrop = $("as-backdrop");
  if(asBackdrop) asBackdrop.addEventListener("click", closeActionSheet);

  function showCtxMenu(x, y, id){
    var menu = $("ctx-menu");
    var overlay = $("ctx-overlay");
    if(!menu || !overlay) return;
    var isPinned = false;
    var hist = window.chatApp && window.chatApp.getHistory ? window.chatApp.getHistory() : [];
    for(var i = 0; i < hist.length; i++){
      if(hist[i].id === id){ isPinned = !!hist[i].pinned; break; }
    }
    var pinLabel = isPinned ? "Kitűzés feloldása" : "Kitűzés";
    menu.innerHTML =
      '<button type="button" class="ctx-item" data-act="open"><svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>Megnyitás</button>' +
      '<button type="button" class="ctx-item" data-act="pin"><svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>' + pinLabel + '</button>' +
      '<button type="button" class="ctx-item danger" data-act="del"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Törlés</button>';
    menu.style.left = Math.min(x, window.innerWidth - 220) + "px";
    menu.style.top = Math.min(y, window.innerHeight - 160) + "px";
    menu.classList.add("vis");
    overlay.classList.add("vis");
    menu.querySelectorAll(".ctx-item").forEach(function(item){
      item.addEventListener("click", function(){
        var act = item.getAttribute("data-act");
        hideCtxMenu();
        if(act === "open" && window.chatApp) window.chatApp.loadConversation(id);
        if(act === "del"){
          openActionSheet("Beszélgetés törlése", "Biztosan törölni szeretnéd?", [
            { label: "Törlés", destructive: true, action: function(){ if(window.chatApp) window.chatApp.deleteConversation(id); } }
          ]);
        }
        if(act === "pin"){
          var hist2 = window.chatApp && window.chatApp.getHistory ? window.chatApp.getHistory() : [];
          for(var j = 0; j < hist2.length; j++){
            if(hist2[j].id === id){ hist2[j].pinned = !hist2[j].pinned; break; }
          }
          try{ localStorage.setItem("chat_history_v1", JSON.stringify(hist2)); }catch(e){}
          renderHistoryList();
        }
      });
    });
  }

  function hideCtxMenu(){
    var menu = $("ctx-menu");
    var overlay = $("ctx-overlay");
    if(menu) menu.classList.remove("vis");
    if(overlay) overlay.classList.remove("vis");
  }

  var ctxOverlay = $("ctx-overlay");
  if(ctxOverlay) ctxOverlay.addEventListener("click", hideCtxMenu);

  var sbBody = document.querySelector(".sb-body");
  if(sbBody){
    var pullArmed = false;
    var pullStartY = 0;
    sbBody.addEventListener("touchstart", function(e){
      if(sbBody.scrollTop <= 0 && !searchOpen){
        pullArmed = true;
        pullStartY = e.touches[0].clientY;
      } else {
        pullArmed = false;
      }
    }, { passive: true });

    sbBody.addEventListener("touchmove", function(e){
      if(!pullArmed) return;
      var dy = e.touches[0].clientY - pullStartY;
      if(dy > 12){
        sidebarEl.classList.add("pull-hinting");
      }
      if(dy > 72){
        openSearch();
        pullArmed = false;
        sidebarEl.classList.remove("pull-hinting");
      }
    }, { passive: true });

    function disarmPull(){
      pullArmed = false;
      sidebarEl.classList.remove("pull-hinting");
    }
    sbBody.addEventListener("touchend", disarmPull, { passive: true });
    sbBody.addEventListener("touchcancel", disarmPull, { passive: true });
  }

  (function(){
    var touchId = null;
    var startX = 0, startY = 0, lastDx = 0;
    var dir = null;
    var w = 0;

    document.addEventListener("touchstart", function(e){
      if(touchId !== null) return;
      var t = e.changedTouches[0];
      if(!sbOpen && t.clientX > 40) return;
      var target = e.target;
      if(target && target.closest){
        if(target.closest(".cb pre, .md-table-scroll, .img-strip, .src-chips, #ta, input, textarea, .lightbox-stage")){
          return;
        }
      }
      touchId = t.identifier;
      startX = t.clientX;
      startY = t.clientY;
      lastDx = 0;
      dir = null;
      w = (sidebarEl && sidebarEl.getBoundingClientRect().width) || window.innerWidth;
    }, { passive: true });

    document.addEventListener("touchmove", function(e){
      if(touchId === null) return;
      var t = null;
      for(var i = 0; i < e.changedTouches.length; i++){
        if(e.changedTouches[i].identifier === touchId){ t = e.changedTouches[i]; break; }
      }
      if(!t) return;
      var dx = t.clientX - startX;
      var dy = t.clientY - startY;
      lastDx = dx;

      if(dir === null){
        if(Math.abs(dx) + Math.abs(dy) >= 6){
          dir = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
        }
      }
      if(dir === "v"){
        touchId = null;
        return;
      }
      if(dir === "h"){
        if(!sbOpen && startX <= 40 && dx > 0){
          sidebarEl.classList.add("dragging");
          var pct = Math.min(0, -100 + (dx / w) * 100);
          sidebarEl.style.transform = "translateX(" + pct + "%)";
        } else if(sbOpen && dx < 0){
          sidebarEl.classList.add("dragging");
          var pct2 = Math.max(-100, (dx / w) * 100);
          sidebarEl.style.transform = "translateX(" + pct2 + "%)";
        }
      }
    }, { passive: true });

    document.addEventListener("touchend", function(e){
      if(touchId === null) return;
      var found = false;
      for(var i = 0; i < e.changedTouches.length; i++){
        if(e.changedTouches[i].identifier === touchId){ found = true; break; }
      }
      if(!found) return;

      sidebarEl.classList.remove("dragging");
      sidebarEl.style.transform = "";
      var threshold = Math.max(80, Math.min(w * 0.18, 140));
      if(!sbOpen && lastDx > threshold){
        openSB();
      } else if(sbOpen && lastDx < -threshold){
        closeSB();
      }
      touchId = null;
      dir = null;
      lastDx = 0;
    }, { passive: true });

    document.addEventListener("touchcancel", function(){
      if(touchId === null) return;
      sidebarEl.classList.remove("dragging");
      sidebarEl.style.transform = "";
      touchId = null;
      dir = null;
      lastDx = 0;
    }, { passive: true });
  })();

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(document.getElementById("action-sheet") && document.getElementById("action-sheet").getAttribute("aria-hidden") === "false") closeActionSheet();
      else if(document.getElementById("ctx-menu") && document.getElementById("ctx-menu").classList.contains("vis")) hideCtxMenu();
      else if(sbOpen) closeSB();
      else if(searchOpen) closeSearch();
    } else if((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")){
      e.preventDefault();
      if(sbOpen) closeSB(); else openSB();
    }
  });

  var btnSbNew = $("btn-sb-new");
  if(btnSbNew){
    btnSbNew.addEventListener("click", function(){
      if(window.chatApp) window.chatApp.newConversation();
      else closeSB();
    });
  }

  var ta = $("ta");
  if(ta){
    ta.addEventListener("keydown", function(e){
      if(e.key === "Enter"){
        e.stopPropagation();
      }
    });
  }

  window.openSB = openSB;
  window.closeSB = closeSB;
  window.openSearch = openSearch;
  window.closeSearch = closeSearch;
  window.renderHistoryList = renderHistoryList;

  renderHistoryList();

  (function setupBrowserKeyboard(){
    if(!window.visualViewport) return;
    var lastH = 0;
    var nativeManaged = false;
    window.__keyboardNativeManaged = function(v){ nativeManaged = !!v; };
    function sync(){
      if(nativeManaged) return;
      var vv = window.visualViewport;
      var occluded = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      var wrap = document.getElementById("ib-wrap");
      if(!wrap) return;
      if(occluded > 40){
        document.documentElement.style.setProperty("--native-keyboard-height", occluded + "px");
        wrap.classList.add("keyboard-open");
      } else {
        document.documentElement.style.setProperty("--native-keyboard-height", "0px");
        wrap.classList.remove("keyboard-open");
      }
      if(Math.abs(occluded - lastH) > 2){
        lastH = occluded;
        if(typeof scheduleBridgeFlush === "function") scheduleBridgeFlush();
      }
    }
    window.visualViewport.addEventListener("resize", sync, { passive: true });
    window.visualViewport.addEventListener("scroll", sync, { passive: true });
  })();
})();
</script>
